
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory — ron.cool</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    color: #111;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 40px 20px;
}

.back {
    display: inline-block;
    margin-bottom: 25px;
    color: #555;
    text-decoration: none;
}

.kicker {
    font-size: 13px;
    color: #777;
    margin-bottom: 8px;
}

h1 {
    font-size: 52px;
    margin: 0;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
}

/* SCORE */

.scoreboard {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}

.score {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px 25px;
    flex: 1;
}

.score-label {
    color: #888;
    font-size: 12px;
    text-transform: uppercase;
}

.score-number {
    font-size: 30px;
    font-weight: bold;
    margin-top: 5px;
}

/* GAME */

.game-panel {
    background: white;
    border: 1px solid #ddd;
    border-radius: 16px;
    padding: 25px;
}

.status {
    text-align: center;
    margin-bottom: 20px;
}

.status-main {
    font-size: 25px;
    font-weight: bold;
}

.status-sub {
    color: #777;
    margin-top: 5px;
}

.grid {
    width: 330px;
    max-width: 100%;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.memory-tile {
    aspect-ratio: 1;
    border: 0;
    border-radius: 12px;
    background: #e5e5e5;
    cursor: pointer;
    transition: .12s;
}

.memory-tile:hover {
    background: #d5d5d5;
}

.memory-tile.active {
    background: #111;
    transform: scale(.94);
}

.memory-tile.pressed {
    transform: scale(.94);
}

.start-btn,
.action-btn {
    border: 0;
    border-radius: 9px;
    padding: 12px 18px;
    background: #111;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

.start-btn:disabled,
.action-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.message {
    text-align: center;
    margin-top: 15px;
    color: #777;
}

/* GAME OVER */

.game-over {
    background: white;
    border: 1px solid #ddd;
    border-radius: 16px;
    padding: 25px;
    margin-top: 20px;
}

.final-score {
    font-size: 28px;
    margin: 15px 0;
}

.name-input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 15px;
}

.leaderboard-choice {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 14px;
    color: #666;
    margin-bottom: 18px;
}

.leaderboard-choice input {
    margin-top: 3px;
}

#submitStatus {
    margin-top: 12px;
}

/* LEADERBOARD */

.leaderboard {
    margin-top: 25px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 16px;
    padding: 25px;
}

.leaderboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.leaderboard-header h2 {
    margin: 0;
}

.live {
    font-size: 12px;
    padding: 5px 9px;
    border-radius: 20px;
    background: #e8f8ed;
    color: #16803c;
}

.leaderboard-row {
    display: grid;
    grid-template-columns: 55px 1fr 70px;
    gap: 10px;
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.leaderboard-row:last-child {
    border-bottom: 0;
}

.leaderboard-position {
    color: #888;
}

.leaderboard-name {
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
}

.leaderboard-score {
    text-align: right;
    font-weight: bold;
}

.loading {
    color: #888;
    text-align: center;
    padding: 20px;
}

.footer {
    text-align: center;
    color: #999;
    margin-top: 30px;
    font-size: 13px;
}

.hidden {
    display: none;
}

</style>
</head>

<body>

<div class="container">

<a href="javascript:history.back()" class="back">
    ← Back
</a>

<div class="kicker">
    ron.cool / brain test
</div>

<h1>Memory.</h1>

<p class="subtitle">
    Watch the pattern. Remember it.
</p>


<!-- SCORE -->

<div class="scoreboard">

    <div class="score">

        <div class="score-label">
            Current
        </div>

        <div
            class="score-number"
            id="currentScore">
            0
        </div>

    </div>

    <div class="score">

        <div class="score-label">
            Best
        </div>

        <div
            class="score-number"
            id="bestScore">
            0
        </div>

    </div>

</div>


<!-- GAME -->

<div class="game-panel">

    <div class="status">

        <div
            class="status-main"
            id="status">
            Ready?
        </div>

        <div
            class="status-sub"
            id="statusSub">
            Press start to begin
        </div>

    </div>


    <div
        class="grid"
        id="grid">
    </div>


    <button
        class="start-btn"
        id="startButton">

        ▶ Start Game

    </button>


    <div
        class="message"
        id="message">

        Your sequence gets longer every round.

    </div>

</div>


<!-- GAME OVER -->

<div
    class="game-over"
    id="gameOver">

    <h2>
        Game Over
    </h2>

    <div class="final-score">

        Round
        <span id="finalScore">
            0
        </span>

    </div>


    <input
        class="name-input"
        id="username"
        maxlength="20"
        autocomplete="off"
        placeholder="Enter your username"
    >


    <label class="leaderboard-choice">

        <input
            type="checkbox"
            id="displayScore"
        >

        <span>
            Display my last game on the global leaderboard.
            If unchecked, my score will not be added to the public leaderboard.
        </span>

    </label>


    <button
        class="action-btn"
        id="submitScore">

        Submit Score

    </button>


    <button
        class="action-btn"
        id="playAgain">

        Play Again

    </button>


    <div
        id="submitStatus"
        class="message">
    </div>

</div>


<!-- LEADERBOARD -->

<div class="leaderboard">

    <div class="leaderboard-header">

        <h2>
            🏆 Global Leaderboard
        </h2>

        <div class="live">
            Live
        </div>

    </div>


    <div id="leaderboardList">

        <div class="loading">
            Loading scores...
        </div>

    </div>

</div>


<div class="footer">
    made with ☕ by ron.cool
</div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {


/* =====================================================
   SUPABASE CONFIG
   ===================================================== */

const SUPABASE_URL =
    "https://rldidvwcylirjyfktvtg.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsZGlkdndjeWxpcmp5Zmt0dnRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMjM0OTAsImV4cCI6MjEwMTc5OTQ5MH0.YO5zeu5uL3siDDPVfsPc9v_VCETHixTWXjzotVOEp0U";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ELEMENTS
   ===================================================== */

const grid =
    document.getElementById("grid");

const startButton =
    document.getElementById("startButton");

const currentScore =
    document.getElementById("currentScore");

const bestScore =
    document.getElementById("bestScore");

const status =
    document.getElementById("status");

const statusSub =
    document.getElementById("statusSub");

const message =
    document.getElementById("message");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const username =
    document.getElementById("username");

const displayScore =
    document.getElementById("displayScore");

const submitScore =
    document.getElementById("submitScore");

const submitStatus =
    document.getElementById("submitStatus");

const playAgain =
    document.getElementById("playAgain");

const leaderboardList =
    document.getElementById("leaderboardList");


/* =====================================================
   GAME
   ===================================================== */

const TILE_COUNT = 9;

let sequence = [];

let playerSequence = [];

let round = 0;

let playing = false;

let acceptingInput = false;

let personalBest =
    Number(
        localStorage.getItem(
            "roncool_memory_best"
        ) || 0
    );


bestScore.textContent =
    personalBest;


/* =====================================================
   CREATE GRID
   ===================================================== */

function createGrid() {

    grid.innerHTML = "";

    for (
        let i = 0;
        i < TILE_COUNT;
        i++
    ) {

        const tile =
            document.createElement("button");

        tile.className =
            "memory-tile";

        tile.type =
            "button";

        tile.dataset.index =
            i;

        tile.addEventListener(
            "click",
            function () {

                tileClicked(i);

            }
        );

        grid.appendChild(tile);
    }
}


/* =====================================================
   LIGHT TILE
   ===================================================== */

function lightTile(index) {

    return new Promise(resolve => {

        const tiles =
            grid.querySelectorAll(
                ".memory-tile"
            );

        const tile =
            tiles[index];

        tile.classList.add(
            "active"
        );

        setTimeout(
            function () {

                tile.classList.remove(
                    "active"
                );

                resolve();

            },
            450
        );

    });

}


/* =====================================================
   SHOW SEQUENCE
   ===================================================== */

async function showSequence() {

    acceptingInput = false;

    status.textContent =
        "Watch.";

    statusSub.textContent =
        "Remember the pattern.";

    await new Promise(
        resolve =>
            setTimeout(resolve, 500)
    );


    for (
        const index of sequence
    ) {

        await lightTile(index);

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    150
                )
        );

    }


    playerSequence = [];

    acceptingInput = true;

    status.textContent =
        "Your turn.";

    statusSub.textContent =
        "Repeat the pattern.";
}


/* =====================================================
   START
   ===================================================== */

async function startGame() {

    gameOver.classList.add(
        "hidden"
    );

    playing = true;

    acceptingInput = false;

    sequence = [];

    playerSequence = [];

    round = 0;

    currentScore.textContent =
        "0";

    status.textContent =
        "Get ready...";

    statusSub.textContent =
        "Watch carefully.";

    message.textContent =
        "Your sequence gets longer every round.";

    startButton.disabled =
        true;

    addRandomTile();

    await showSequence();
}


/* =====================================================
   ADD TILE
   ===================================================== */

function addRandomTile() {

    const index =
        Math.floor(
            Math.random() *
            TILE_COUNT
        );

    sequence.push(index);
}


/* =====================================================
   TILE CLICK
   ===================================================== */

function tileClicked(index) {

    if (
        !playing ||
        !acceptingInput
    ) {
        return;
    }


    const tiles =
        grid.querySelectorAll(
            ".memory-tile"
        );

    tiles[index].classList.add(
        "pressed"
    );

    setTimeout(
        function () {

            tiles[index].classList.remove(
                "pressed"
            );

        },
        120
    );


    playerSequence.push(index);


    const position =
        playerSequence.length - 1;


    /* WRONG */

    if (
        playerSequence[position] !==
        sequence[position]
    ) {

        endGame();

        return;
    }


    /* COMPLETE */

    if (
        playerSequence.length ===
        sequence.length
    ) {

        acceptingInput = false;

        round++;

        currentScore.textContent =
            round;

        message.textContent =
            "Correct! Next round...";

        setTimeout(
            async function () {

                addRandomTile();

                await showSequence();

            },
            700
        );
    }

}


/* =====================================================
   GAME OVER
   ===================================================== */

function endGame() {

    playing = false;

    acceptingInput = false;

    startButton.disabled = false;

    finalScore.textContent =
        round;

    status.textContent =
        "Game Over";

    statusSub.textContent =
        "You got the pattern wrong.";

    message.textContent =
        "Choose whether you want to submit your score.";

    gameOver.classList.remove(
        "hidden"
    );


    if (
        round > personalBest
    ) {

        personalBest =
            round;

        localStorage.setItem(
            "roncool_memory_best",
            personalBest
        );

        bestScore.textContent =
            personalBest;
    }

}


/* =====================================================
   SUBMIT SCORE
   ===================================================== */

submitScore.addEventListener(
    "click",
    async function () {

        submitStatus.textContent =
            "";


        if (
            !displayScore.checked
        ) {

            submitStatus.textContent =
                "Your score was not added to the public leaderboard.";

            return;
        }


        const name =
            username.value.trim();


        if (!name) {

            submitStatus.textContent =
                "Please enter a username.";

            return;
        }


        if (round <= 0) {

            submitStatus.textContent =
                "You need to complete at least one round.";

            return;
        }


        submitScore.disabled =
            true;

        submitStatus.textContent =
            "Submitting...";


        const {
            error
        } = await supabase
            .from("memory_scores")
            .insert({

                username:
                    name.substring(
                        0,
                        20
                    ),

                score:
                    round,

                display_on_leaderboard:
                    true

            });


        if (error) {

            console.error(
                "SUPABASE ERROR:",
                error
            );

            submitStatus.textContent =
                "Failed to submit: " +
                error.message;

            submitScore.disabled =
                false;

            return;
        }


        submitStatus.textContent =
            "✓ Score submitted!";

        submitScore.disabled =
            false;

        await loadLeaderboard();

    }
);


/* =====================================================
   LOAD LEADERBOARD
   ===================================================== */

async function loadLeaderboard() {

    leaderboardList.innerHTML =
        '<div class="loading">Loading scores...</div>';


    const {
        data,
        error
    } = await supabase
        .from("memory_scores")
        .select(
            "username, score, created_at"
        )
        .eq(
            "display_on_leaderboard",
            true
        )
        .order(
            "score",
            {
                ascending: false
            }
        )
        .limit(50);


    if (error) {

        console.error(
            "LEADERBOARD ERROR:",
            error
        );

        leaderboardList.innerHTML =
            `<div class="loading">
                Failed to load leaderboard.
                <br>
                <small>${error.message}</small>
            </div>`;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        leaderboardList.innerHTML =
            `<div class="loading">
                No public scores yet.
            </div>`;

        return;
    }


    leaderboardList.innerHTML = "";


    data.forEach(
        function (player, index) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "leaderboard-row";


            const position =
                document.createElement(
                    "span"
                );

            position.className =
                "leaderboard-position";

            position.textContent =
                "#" + (index + 1);


            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "leaderboard-name";

            name.textContent =
                player.username;


            const score =
                document.createElement(
                    "span"
                );

            score.className =
                "leaderboard-score";

            score.textContent =
                player.score;


            row.appendChild(
                position
            );

            row.appendChild(
                name
            );

            row.appendChild(
                score
            );

            leaderboardList.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   PLAY AGAIN
   ===================================================== */

playAgain.addEventListener(
    "click",
    function () {

        username.value = "";

        displayScore.checked = false;

        submitStatus.textContent =
            "";

        startGame();

    }
);


/* =====================================================
   START BUTTON
   ===================================================== */

startButton.addEventListener(
    "click",
    startGame
);


/* =====================================================
   INITIALISE
   ===================================================== */

createGrid();

loadLeaderboard();

console.log(
    "Memory game loaded successfully."
);

});
</script>

</body>
</html>
