<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ron.cool / blog</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #fff;
        }

        a {
            color: inherit;
        }

        .page {
            width: min(1100px, calc(100% - 30px));
            margin: auto;
            padding: 30px 0 60px;
        }

        .back {
            display: inline-block;
            margin-bottom: 40px;
            text-decoration: none;
            opacity: .6;
        }

        .back:hover {
            opacity: 1;
        }

        .kicker {
            color: #00ff9d;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            font-size: clamp(45px, 8vw, 80px);
            margin: 0;
            letter-spacing: -4px;
        }

        .subtitle {
            opacity: .6;
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 40px;
        }

        /* =========================
           ANNOUNCEMENTS
        ========================= */

        .announcements {
            margin-bottom: 45px;
        }

        .announcements-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .announcements-header h2 {
            margin: 0;
        }

        .live {
            font-size: 10px;
            font-weight: bold;
            background: #00ff9d;
            color: #000;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .announcement {
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;
            background: rgba(255,255,255,.03);
        }

        .announcement-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .announcement-tag {
            font-size: 11px;
            font-weight: bold;
            padding: 5px 9px;
            border-radius: 6px;
            background: rgba(0,255,157,.12);
            color: #00ff9d;
        }

        .announcement-date {
            font-size: 12px;
            opacity: .5;
        }

        .announcement h3 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .announcement p {
            margin: 0;
            line-height: 1.6;
            opacity: .75;
        }

        .loading,
        .no-announcements {
            padding: 15px 0;
            opacity: .5;
        }

        /* =========================
           FILTERS
        ========================= */

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter {
            border: 1px solid rgba(255,255,255,.12);
            background: transparent;
            color: white;
            padding: 8px 13px;
            border-radius: 8px;
            cursor: pointer;
        }

        .filter:hover {
            background: rgba(255,255,255,.08);
        }

        .filter.active {
            background: #fff;
            color: #000;
        }

        /* =========================
           POSTS
        ========================= */

        .posts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .post-card {
            animation: fadeUp .4s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post-open {
            width: 100%;
            text-align: left;
            padding: 0;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255,255,255,.03);
            color: white;
            cursor: pointer;
        }

        .post-open:hover {
            background: rgba(255,255,255,.06);
        }

        .post-image {
            display: block;
            width: 100%;
            max-height: 240px;
            object-fit: cover;
        }

        .post-content {
            padding: 20px;
        }

        .post-meta {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 12px;
            opacity: .55;
            margin-bottom: 10px;
        }

        .post-tag {
            display: inline-block;
            color: #00ff9d;
            background: rgba(0,255,157,.1);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
        }

        .post-content h2 {
            margin: 0 0 10px;
        }

        .excerpt {
            opacity: .65;
            line-height: 1.5;
        }

        .read {
            color: #00ff9d;
            font-weight: bold;
            font-size: 14px;
        }

        /* =========================
           READER
        ========================= */

        .hidden {
            display: none !important;
        }

        .reader {
            max-width: 800px;
            margin: auto;
        }

        .reader-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .reader-top {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            font-size: 13px;
            opacity: .6;
        }

        .reader h2 {
            font-size: clamp(35px, 6vw, 60px);
            margin: 0 0 25px;
            letter-spacing: -2px;
        }

        .reader-body {
            font-size: 17px;
            line-height: 1.8;
            opacity: .85;
            white-space: pre-wrap;
        }

        .reader-back {
            margin-bottom: 30px;
            cursor: pointer;
            border: 0;
            background: transparent;
            color: white;
            opacity: .6;
            font-size: 15px;
        }

        .reader-back:hover {
            opacity: 1;
        }

        .footer {
            margin-top: 60px;
            text-align: center;
            opacity: .4;
            font-size: 13px;
        }

    </style>

</head>


<body>

<div class="page">

    <a href="index.html" class="back">
        ← Back
    </a>


    <main id="archive">

        <div class="kicker">
            ron.cool / blog
        </div>

        <h1>
            Thoughts.
        </h1>

        <p class="subtitle">
            Random thoughts, experiments and things I've made.
        </p>


        <!-- =====================================
             SUPABASE ANNOUNCEMENTS
        ====================================== -->

        <section
            class="announcements"
            id="announcements"
        >

            <div class="announcements-header">

                <span>📢</span>

                <h2>
                    Site Announcements
                </h2>

                <span class="live">
                    LIVE
                </span>

            </div>


            <div id="announcementList">

                <div class="loading">
                    Loading announcements...
                </div>

            </div>

        </section>


        <!-- =====================================
             BLOG FILTERS
        ====================================== -->

        <div id="filters" class="filters"></div>


        <div
            id="postCount"
            style="display:none;"
        >
            0
        </div>


        <!-- =====================================
             BLOG POSTS
        ====================================== -->

        <section
            id="posts"
            class="posts"
        ></section>

    </main>


    <!-- =====================================
         BLOG READER
    ====================================== -->

    <main
        id="reader"
        class="reader hidden"
    >

        <button
            id="backArchive"
            class="reader-back"
        >
            ← Back to blog
        </button>


        <div id="readerContent"></div>

    </main>


    <div class="footer">
        made with ☕ by ron.cool
    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://rldidvwcylirjyfktvtg.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsZGlkdndjeWxpcmp5Zmt0dnRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMjM0OTAsImV4cCI6MjEwMTc5OTQ5MH0.YO5zeu5uL3siDDPVfsPc9v_VCETHixTWXjzotVOEp0U";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value).replace(
        /[&<>"']/g,
        character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[character])
    );

}


/* =====================================================
   BLOG POSTS
===================================================== */

const BLOG_POSTS = [

    {
        title: "Welcome to the ron.cool blog",

        date: "August 8, 2026",

        tag: "Updates",

        image: "",

        body:
`This is where new thoughts, tiny experiments, and curious discoveries will live.

`
    },


    {
        title: "About me",

        date: "August 8, 2026",

        tag: "Talking about myself",

        image: "",

        body:
`# Hi, I'm Ron 👋

I like making small web experiments, building weird little projects, and sharing the things I learn along the way.

This blog is where I write about what I'm working on, what I'm curious about, and whatever happens to be on my mind. Expect a mix of experiments, ideas, development stuff, random discoveries, and probably a few things that don't fit anywhere else.

The design and overall idea of this site are heavily inspired by Neal.fun, which has been a huge inspiration for me. You may notice some similarities in the style, name, and experimental approach.

This isn't meant to be a copy of Neal's work, though. I'm using that inspiration to build something that feels like me and to experiment with my own ideas.

Thanks for stopping by. I hope you find something interesting here. :)`
    },


    {
        title: "Addresing my ai useage for the sites",

        date: "August 8, 2026",

        tag: "Addresing my ai useage for the sites",

        image: "",

        body:
`First off i would like to say that i do use ai to help me with the sites, but i do not use it to make the sites for me. I use it to help me with ideas, code, and design.

I do not use it to make the sites for me because i want to learn and improve my skills. I want to be able to make the sites myself, and i want to be able to understand how they work.

I also want to be able to fix them if something goes wrong.

Now hopefully in the future i will be able to make things with 0% ai, but right now im still learning and improving my skills, so i use ai to help me with that.

I hope this clears up any confusion about my use of ai on the sites.`
    },


    {
        title: "Info",

        date: "August 8, 2026",

        tag: "Some information",

        image: "",

        body:
`Just letting everyone reading know: the reason so many apps get added so often is because i have so many unfinished (and finished) projects on my computer that i have made over my time learning HTML, that it is so easy for me to just add them to the site.

I have so many ideas that i want to make, and i want to make them all, so i just add them to the site as i make them.

I also want to be able to share my work with others, and i want to be able to get feedback on my work.

I also want to be able to learn from others, and i want to be able to improve my skills.

So i just add them to the site as i make them.`
    },


    {
        title: "Keeping ron.cool safe",

        date: "August 9, 2026",

        tag: "Site & Security",

        image: "",

        body:
`I've recently ramped up the security on ron.cool to make it a safer and more trustworthy space for everyone who stops by.

Now, the site is equipped with HTTPS encryption, which means your connection to ron.cool is secure. You should spot that little padlock 🔒 in your browser when you visit.

So, if you’ve been curious whether ron.cool is a legitimate site or just some random GitHub Pages project — yes, it did start that way 😂, but I’m gradually transforming it into something much more substantial.

Thanks for stopping by and supporting ron.cool. There’s still so much more I want to create!`
    }

];


/* =====================================================
   BLOG ELEMENTS
===================================================== */

const postsElement =
    document.getElementById("posts");

const filtersElement =
    document.getElementById("filters");

const archiveElement =
    document.getElementById("archive");

const readerElement =
    document.getElementById("reader");

const readerContent =
    document.getElementById("readerContent");

let activeTag = "All";


/* =====================================================
   BLOG FUNCTIONS
===================================================== */

function formatBody(value) {

    return escapeHtml(value)
        .replace(
            /\n/g,
            "<br>"
        );

}


function tags() {

    return [
        "All",
        ...new Set(
            BLOG_POSTS.map(
                post => post.tag
            )
        )
    ];

}


function filteredPosts() {

    return BLOG_POSTS.filter(
        post =>
            activeTag === "All" ||
            post.tag === activeTag
    );

}


function imageMarkup(
    post,
    className
) {

    return post.image

        ? `
            <img
                class="${className}"
                src="${escapeHtml(post.image)}"
                alt=""
            >
          `

        : "";

}


/* =====================================================
   FILTERS
===================================================== */

function renderFilters() {

    filtersElement.innerHTML =
        tags()
            .map(
                tag => `
                    <button
                        class="filter ${
                            tag === activeTag
                                ? "active"
                                : ""
                        }"
                        data-tag="${escapeHtml(tag)}"
                    >
                        ${escapeHtml(tag)}
                    </button>
                `
            )
            .join("");


    document
        .querySelectorAll("[data-tag]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    activeTag =
                        button.dataset.tag;

                    renderFilters();

                    renderPosts();

                }
            );

        });

}


/* =====================================================
   POSTS
===================================================== */

function renderPosts() {

    const posts =
        filteredPosts();


    document
        .getElementById("postCount")
        .textContent =
        BLOG_POSTS.length;


    postsElement.innerHTML =
        posts.length

            ? posts
                .map(
                    (post, index) => `

                        <article
                            class="post-card"
                            style="
                                animation-delay:
                                ${Math.min(
                                    index * 45,
                                    220
                                )}ms
                            "
                        >

                            <button
                                class="post-open"
                                data-post="${
                                    BLOG_POSTS.indexOf(post)
                                }"
                            >

                                ${imageMarkup(
                                    post,
                                    "post-image"
                                )}

                                <div
                                    class="post-content"
                                >

                                    <div
                                        class="post-meta"
                                    >

                                        <span
                                            class="post-tag"
                                        >
                                            ${escapeHtml(
                                                post.tag
                                            )}
                                        </span>

                                        <span>
                                            ${escapeHtml(
                                                post.date
                                            )}
                                        </span>

                                    </div>


                                    <h2>
                                        ${escapeHtml(
                                            post.title
                                        )}
                                    </h2>


                                    <p
                                        class="excerpt"
                                    >
                                        ${escapeHtml(
                                            post.body
                                                .split("\n")[0]
                                                .slice(0,150)
                                        )}
                                        ${
                                            post.body.length > 150
                                                ? "..."
                                                : ""
                                        }
                                    </p>


                                    <span
                                        class="read"
                                    >
                                        Read post →
                                    </span>

                                </div>

                            </button>

                        </article>
                    `
                )
                .join("")

            : "No posts in this corner yet.";


    document
        .querySelectorAll(".post-open")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    openPost(
                        Number(
                            button.dataset.post
                        )
                    );

                }
            );

        });

}


/* =====================================================
   OPEN POST
===================================================== */

function openPost(index) {

    const post =
        BLOG_POSTS[index];

    if (!post) return;


    archiveElement
        .classList
        .add("hidden");


    readerElement
        .classList
        .remove("hidden");


    readerContent.innerHTML = `

        ${imageMarkup(
            post,
            "reader-image"
        )}

        <div class="reader-top">

            <span class="post-tag">
                ${escapeHtml(post.tag)}
            </span>

            <span>
                ${escapeHtml(post.date)}
            </span>

        </div>


        <h2>
            ${escapeHtml(post.title)}
        </h2>


        <div class="reader-body">

            ${formatBody(post.body)}

        </div>
    `;


    history.pushState(
        {
            post: index
        },
        "",
        `?post=${index}`
    );


    window.scrollTo(
        0,
        0
    );

}


/* =====================================================
   CLOSE POST
===================================================== */

function closePost() {

    readerElement
        .classList
        .add("hidden");


    archiveElement
        .classList
        .remove("hidden");


    history.pushState(
        {},
        "",
        "blog.html"
    );


    window.scrollTo(
        0,
        0
    );

}


document
    .getElementById("backArchive")
    .addEventListener(
        "click",
        closePost
    );


window.addEventListener(
    "popstate",
    closePost
);


/* =====================================================
   SUPABASE ANNOUNCEMENTS
===================================================== */

async function loadAnnouncements() {

    const list =
        document.getElementById(
            "announcementList"
        );


    if (!list) return;


    try {

        const response =
            await fetch(

                `${SUPABASE_URL}/rest/v1/site_announcements` +

                `?select=id,title,content,tag,created_at` +

                `&published=eq.true` +

                `&order=created_at.desc`,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_ANON_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_ANON_KEY}`,

                        "Content-Type":
                            "application/json"

                    }

                }

            );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(
                "Supabase error:",
                error
            );

            throw new Error(
                "Failed to load announcements"
            );

        }


        const announcements =
            await response.json();


        if (
            announcements.length === 0
        ) {

            list.innerHTML = `

                <div
                    class="no-announcements"
                >
                    No announcements right now.
                </div>

            `;

            return;

        }


        list.innerHTML =
            announcements
                .map(
                    announcement => {

                        const date =
                            new Date(
                                announcement.created_at
                            )
                            .toLocaleDateString(
                                "en-GB",
                                {
                                    day: "numeric",
                                    month: "long",
                                    year: "numeric"
                                }
                            );


                        return `

                            <article
                                class="announcement"
                            >

                                <div
                                    class="announcement-top"
                                >

                                    <span
                                        class="announcement-tag"
                                    >
                                        ${escapeHtml(
                                            announcement.tag ||
                                            "Update"
                                        )}
                                    </span>

                                    <span
                                        class="announcement-date"
                                    >
                                        ${escapeHtml(
                                            date
                                        )}
                                    </span>

                                </div>


                                <h3>
                                    ${escapeHtml(
                                        announcement.title
                                    )}
                                </h3>


                                <p>
                                    ${escapeHtml(
                                        announcement.content
                                    ).replace(
                                        /\n/g,
                                        "<br>"
                                    )}
                                </p>

                            </article>

                        `;

                    }
                )
                .join("");


    } catch (error) {

        console.error(
            "Announcement loading failed:",
            error
        );


        list.innerHTML = `

            <div
                class="no-announcements"
            >
                Unable to load announcements.
            </div>

        `;

    }

}


/* =====================================================
   START BLOG
===================================================== */

renderFilters();

renderPosts();

loadAnnouncements();


/* =====================================================
   AUTO REFRESH ANNOUNCEMENTS
===================================================== */

setInterval(
    loadAnnouncements,
    30000
);


/* =====================================================
   OPEN POST FROM URL
===================================================== */

const sharedIndex =
    new URLSearchParams(
        location.search
    ).get("post");


if (
    sharedIndex !== null
) {

    openPost(
        Number(sharedIndex)
    );

}

</script>

</body>
</html>
