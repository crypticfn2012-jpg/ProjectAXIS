
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ron.cool / blog</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .kicker {
            font-size: 13px;
            color: #777;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 52px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .hidden {
            display: none !important;
        }

        /* FILTERS */

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .filter {
            border: 1px solid #ddd;
            background: white;
            border-radius: 999px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        .filter:hover {
            background: #eee;
        }

        .filter.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        /* POSTS */

        .posts {
            display: grid;
            gap: 15px;
        }

        .post-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            overflow: hidden;
        }

        .post-open {
            width: 100%;
            padding: 0;
            border: 0;
            background: transparent;
            text-align: left;
            cursor: pointer;
        }

        .post-content {
            padding: 22px;
        }

        .post-meta {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 13px;
            color: #777;
            margin-bottom: 10px;
        }

        .post-tag {
            background: #111;
            color: white;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
        }

        .post-content h2 {
            margin: 5px 0 10px;
            font-size: 25px;
        }

        .excerpt {
            color: #666;
            line-height: 1.6;
            margin: 0 0 12px;
        }

        .read {
            font-weight: bold;
            color: #111;
        }

        /* ANNOUNCEMENTS */

        .announcement-section {
            margin-bottom: 35px;
        }

        .announcement-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .announcement-title h2 {
            margin: 0;
        }

        .live {
            background: #00b86b;
            color: white;
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .announcement-card {
            background: #111;
            color: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 12px;
        }

        .announcement-card .post-meta {
            color: #aaa;
        }

        .announcement-card .post-tag {
            background: #00c878;
            color: #111;
        }

        .announcement-card h3 {
            margin: 10px 0;
            font-size: 24px;
        }

        .announcement-content {
            white-space: pre-wrap;
            line-height: 1.7;
            color: #ddd;
        }

        .announcement-error {
            padding: 15px;
            background: #fff0f0;
            color: #b00020;
            border: 1px solid #ffcaca;
            border-radius: 12px;
        }

        /* READER */

        .reader {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            padding: 30px;
        }

        .back-btn {
            border: 1px solid #ddd;
            background: white;
            padding: 9px 14px;
            border-radius: 9px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .back-btn:hover {
            background: #eee;
        }

        .reader h2 {
            font-size: 40px;
            margin: 12px 0 25px;
        }

        .reader-body {
            white-space: pre-wrap;
            line-height: 1.8;
            color: #333;
            font-size: 17px;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            color: #999;
            font-size: 13px;
        }

        .loading {
            color: #777;
            padding: 15px 0;
        }

        .empty {
            color: #777;
            padding: 20px 0;
        }

        @media (max-width: 600px) {

            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 40px;
            }

            .reader h2 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div id="archive">

        <div class="kicker">
            ron.cool / blog
        </div>

        <h1>
            Thoughts.
        </h1>

        <p class="subtitle">

        <!-- SUPABASE ANNOUNCEMENTS -->

        <section class="announcement-section">

            <div class="announcement-title">

                <h2>

                    LIVE

        <!-- FILTERS -->

        <div
            class="filters"

        <p

        >
            <span id="postCount">0</span>
            posts

        <!-- POSTS -->

        <div
            class="posts"
            id="posts">
        </div>

    </div>


    <!-- READER -->

    <div
        class="reader hidden"
        id="reader"
    >

        <button
            class="back-btn"
            id="backArchive"
        >
            ← Back

        <div id="readerContent">

    </div>


    <div class="footer">
        made with ☕ by ron.cool
    </div>

</div>


<script>



const SUPABASE_URL =
    "https://rldidvwcylirjyfktvtg.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsZGlkdndjeWxpcmp5Zmt0dnRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMjM0OTAsImV4cCI6MjEwMTc5OTQ5MH0.YO5zeu5uL3siDDPVfsPc9v_VCETHixTWXjzotVOEp0U";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   BLOG POSTS
===================================================== */

const BLOG_POSTS = [

    {
        title: "Welcome to the ron.cool blog",

        date: "August 8, 2026",

        tag: "Updates",

        image: "",

        body:
`This is where new thoughts, tiny experiments, and curious discoveries will live.

    {

        body:

    {

        body:
`First off I would like to say that I do use AI to help me with the sites, but I do not use it to make the sites for me.

    {

        image: "",

        body:
`Just letting everyone reading know: the reason so many apps get added so often is because I have so many unfinished and finished projects on my computer that I have made over my time learning HTML.

/* =====================================================
   ELEMENTS
===================================================== */

const postsElement =
    document.getElementById("posts");

const filtersElement =
    document.getElementById("filters");

const archiveElement =
    document.getElementById("archive");

const readerElement =
    document.getElementById("reader");

const readerContent =
    document.getElementById("readerContent");

const announcementsElement =
    document.getElementById("announcements");


let activeTag = "All";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value).replace(
        /[&<>"']/g,

        character => {

            const entities = {

                "&": "&amp;",

                "<": "&lt;",

                ">": "&gt;",

                '"': "&quot;",

                "'": "&#039;"

            };

            return entities[character];

        }
    );

}


/* =====================================================
   IMAGE
===================================================== */

function imageMarkup(post, className) {

    if (!post.image) {
        return "";
    }

    return `
        <img
            class="${className}"
            src="${escapeHtml(post.image)}"
            alt=""
        >
    `;

}


/* =====================================================
   TAGS
===================================================== */

function tags() {

    return [
        "All",
        ...new Set(
            BLOG_POSTS.map(
                post => post.tag
            )
        )
    ];

}


/* =====================================================
   FILTER
===================================================== */

function filteredPosts() {

    return BLOG_POSTS.filter(

        post =>
            activeTag === "All" ||
            post.tag === activeTag

    );

}


/* =====================================================
   RENDER FILTERS
===================================================== */

function renderFilters() {

    filtersElement.innerHTML =
        tags().map(tag => `

            <button
                class="filter ${
                    tag === activeTag
                        ? "active"
                        : ""
                }"
                data-tag="${escapeHtml(tag)}"
            >
                ${escapeHtml(tag)}
            </button>

        `).join("");


    document
        .querySelectorAll("[data-tag]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    activeTag =
                        button.dataset.tag;

                    renderFilters();

                    renderPosts();

                }
            );

        });

}


/* =====================================================
   RENDER POSTS
===================================================== */

function renderPosts() {

    const posts =
        filteredPosts();


    document.getElementById(
        "postCount"
    ).textContent =
        BLOG_POSTS.length;


    if (!posts.length) {

        postsElement.innerHTML =
            `<div class="empty">
                No posts in this corner yet.
            </div>`;

        return;

    }


    postsElement.innerHTML =
        posts.map((post, index) => {

            const originalIndex =
                BLOG_POSTS.indexOf(post);


            const firstLine =
                post.body
                    .split("\n")
                    .find(line => line.trim())
                    || "";


            const excerpt =
                firstLine
                    .replace(/^#+\s*/, "")
                    .slice(0, 150);


            return `

                <article class="post-card">

                    <button
                        class="post-open"
                        data-post="${originalIndex}"
                        aria-label="Read ${escapeHtml(post.title)}"
                    >

                        ${imageMarkup(
                            post,
                            "post-image"
                        )}

                        <div class="post-content">

                            <div class="post-meta">

                                <span class="post-tag">
                                    ${escapeHtml(post.tag)}
                                </span>

                                <span>
                                    ${escapeHtml(post.date)}
                                </span>

                            </div>


                            <h2>
                                ${escapeHtml(post.title)}
                            </h2>


                            <p class="excerpt">

                                ${escapeHtml(excerpt)}

                                ${
                                    post.body.length > 150
                                        ? "..."
                                        : ""
                                }

                            </p>


                            <span class="read">
                                Read post →
                            </span>

                        </div>

                    </button>

                </article>

            `;

        }).join("");


    document
        .querySelectorAll(".post-open")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    openPost(
                        Number(
                            button.dataset.post
                        )
                    );

                }
            );

        });

}


/* =====================================================
   OPEN POST
===================================================== */

function openPost(index) {

    const post =
        BLOG_POSTS[index];


    if (!post) {
        return;
    }


    archiveElement
        .classList
        .add("hidden");


    readerElement
        .classList
        .remove("hidden");


    readerContent.innerHTML = `

        ${imageMarkup(
            post,
            "reader-image"
        )}


        <div class="reader-top">

            <span class="post-tag">
                ${escapeHtml(post.tag)}
            </span>

            <span>
                ${escapeHtml(post.date)}
            </span>

        </div>


        <h2>
            ${escapeHtml(post.title)}
        </h2>


        <div class="reader-body">
            ${escapeHtml(post.body)}
        </div>

    `;


    history.pushState(
        { post: index },
        "",
        `?post=${index}`
    );


    window.scrollTo(
        0,
        0
    );

}


/* =====================================================
   CLOSE POST
===================================================== */

function closePost() {

    readerElement
        .classList
        .add("hidden");


    archiveElement
        .classList
        .remove("hidden");


    history.pushState(
        {},
        "",
        "blog.html"
    );


    window.scrollTo(
        0,
        0
    );

}


/* =====================================================
   ANNOUNCEMENTS
===================================================== */

async function loadAnnouncements() {

    announcementsElement.innerHTML =
        `<div class="loading">
            Loading announcements...
        </div>`;


    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("site_announcements")

            .select(
                "id,title,content,date,published,tag"
            )

            .eq(
                "published",
                true
            )

            .order(
                "date",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Supabase announcement error:",
                error
            );

            announcementsElement.innerHTML = `

                <div class="announcement-error">

                    Unable to load announcements.

                    <br><br>

                    <small>
                        ${escapeHtml(
                            error.message ||
                            "Unknown Supabase error"
                        )}
                    </small>

                </div>

            `;

            return;

        }


        if (
            !data ||
            data.length === 0
        ) {

            announcementsElement.innerHTML =
                `<div class="empty">
                    No announcements yet.
                </div>`;

            return;

        }


        announcementsElement.innerHTML =
            data.map(post => {

                let formattedDate =
                    post.date;


                try {

                    formattedDate =
                        new Date(
                            post.date
                        ).toLocaleDateString(
                            "en-GB",
                            {
                                day: "numeric",
                                month: "long",
                                year: "numeric"
                            }
                        );

                } catch (_) {}


                return `

                    <article
                        class="announcement-card"
                    >

                        <div class="post-meta">

                            <span class="post-tag">
                                ${escapeHtml(
                                    post.tag ||
                                    "Update"
                                )}
                            </span>

                            <span>
                                ${escapeHtml(
                                    formattedDate
                                )}
                            </span>

                        </div>


                        <h3>
                            ${escapeHtml(
                                post.title
                            )}
                        </h3>


                        <div
                            class="announcement-content"
                        >
                            ${escapeHtml(
                                post.content
                            )}
                        </div>

                    </article>

                `;

            }).join("");


    } catch (error) {

        console.error(
            "Announcement loading failed:",
            error
        );


        announcementsElement.innerHTML = `

            <div class="announcement-error">

                Unable to connect to Supabase.

                <br><br>

                <small>
                    ${escapeHtml(
                        error.message ||
                        String(error)
                    )}
                </small>

            </div>

        `;

    }

}


/* =====================================================
   BUTTONS
===================================================== */

document
    .getElementById("backArchive")
    .addEventListener(
        "click",
        closePost
    );


window.addEventListener(
    "popstate",
    () => {

        const params =
            new URLSearchParams(
                location.search
            );


        const index =
            params.get("post");


        if (index !== null) {

            openPost(
                Number(index)
            );

        } else {

            readerElement
                .classList
                .add("hidden");


            archiveElement
                .classList
                .remove("hidden");

        }

    }
);


/* =====================================================
   START
===================================================== */

renderFilters();

renderPosts();

loadAnnouncements();


/* =====================================================
   OPEN POST FROM URL
===================================================== */

const sharedIndex =
    new URLSearchParams(
        location.search
    ).get("post");


if (sharedIndex !== null) {

    openPost(
        Number(sharedIndex)
    );

}

</script>

</body>
</html>
