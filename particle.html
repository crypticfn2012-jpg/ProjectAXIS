
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Playground | ron.cool</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --purple: #667eea;
    --pink: #f093fb;
    --cyan: #00e5ff;
    --dark: #080912;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #667eea33, transparent 30%),
        radial-gradient(circle at 85% 80%, #f093fb25, transparent 30%),
        linear-gradient(135deg, #080912, #111329 50%, #080912);
    color: white;
}

/* =========================
   BACK BUTTON
========================= */

.back-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 1000;

    border: 1px solid rgba(255,255,255,.15);
    background: rgba(10,12,25,.75);
    color: white;

    padding: 8px 13px;
    border-radius: 9px;

    font-size: 12px;
    font-weight: 800;

    cursor: pointer;

    backdrop-filter: blur(12px);

    transition: .2s ease;
}

.back-btn:hover {
    background: rgba(102,126,234,.8);
    transform: translateY(-2px);
}

/* =========================
   HEADER
========================= */

.header {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 50;

    text-align: center;
    pointer-events: none;
}

.header h1 {
    font-size: 22px;
    letter-spacing: -1px;

    text-shadow:
        0 0 20px #667eea66,
        0 3px 20px #000;
}

.header p {
    margin-top: 4px;
    font-size: 10px;
    opacity: .65;
}

/* =========================
   MAIN
========================= */

.main-container {
    position: absolute;
    inset: 0;

    padding: 58px 14px 14px;

    display: grid;
    grid-template-columns: minmax(0, 1fr) 205px;
    gap: 12px;
}

/* =========================
   CANVAS
========================= */

.canvas-wrapper {
    position: relative;

    min-width: 0;
    min-height: 0;

    overflow: hidden;

    border-radius: 18px;

    background:
        radial-gradient(circle at center, #11172b, #05060d);

    border: 1px solid rgba(255,255,255,.08);

    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 0 50px rgba(100,120,255,.05);
}

#canvas {
    display: block;

    width: 100%;
    height: 100%;

    cursor: crosshair;

    touch-action: none;
}

/* canvas hint */

.canvas-hint {
    position: absolute;
    bottom: 12px;
    left: 50%;

    transform: translateX(-50%);

    padding: 7px 12px;

    border-radius: 20px;

    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.08);

    color: rgba(255,255,255,.55);

    font-size: 10px;

    pointer-events: none;

    backdrop-filter: blur(8px);

    transition: opacity .4s;
}

.canvas-wrapper:hover .canvas-hint {
    opacity: .2;
}

/* =========================
   CONTROLS
========================= */

.controls-panel {
    min-height: 0;

    overflow-y: auto;

    padding: 13px;

    display: flex;
    flex-direction: column;
    gap: 10px;

    border-radius: 18px;

    background: rgba(13,15,30,.78);

    border: 1px solid rgba(255,255,255,.08);

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);

    backdrop-filter: blur(18px);
}

.controls-panel::-webkit-scrollbar {
    width: 4px;
}

.controls-panel::-webkit-scrollbar-thumb {
    background: #667eea;
    border-radius: 10px;
}

/* =========================
   CONTROL GROUP
========================= */

.control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.control-label {
    display: flex;
    justify-content: space-between;

    color: rgba(255,255,255,.55);

    font-size: 9px;
    font-weight: 900;

    letter-spacing: 1px;
    text-transform: uppercase;
}

.value {
    color: #9eaaff;
}

/* =========================
   MODES
========================= */

.mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
}

.mode-btn {
    padding: 8px 5px;

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px;

    background: rgba(255,255,255,.04);

    color: rgba(255,255,255,.65);

    font-size: 10px;
    font-weight: 800;

    cursor: pointer;

    transition: .18s;
}

.mode-btn:hover {
    background: rgba(255,255,255,.09);
    color: white;
}

.mode-btn.active {
    color: white;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    border-color: #8898ff;

    box-shadow:
        0 0 18px #667eea33;
}

/* =========================
   COLOUR
========================= */

.color-row {
    display: flex;
    gap: 6px;
}

.color-picker {
    width: 100%;
    height: 34px;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;

    background: transparent;

    cursor: pointer;
}

/* =========================
   PRESETS
========================= */

.preset-colors {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
}

.preset {
    height: 25px;

    border-radius: 7px;

    border: 1px solid rgba(255,255,255,.15);

    cursor: pointer;

    transition: .15s;
}

.preset:hover {
    transform: scale(1.12);
}

/* =========================
   SLIDERS
========================= */

.slider {
    width: 100%;

    height: 4px;

    appearance: none;
    -webkit-appearance: none;

    border-radius: 5px;

    background: rgba(255,255,255,.12);

    outline: none;
}

.slider::-webkit-slider-thumb {
    appearance: none;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: #8998ff;

    cursor: pointer;

    box-shadow:
        0 0 10px #667eea88;
}

.slider::-moz-range-thumb {
    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: #8998ff;

    border: none;

    cursor: pointer;
}

/* =========================
   TOGGLE
========================= */

.toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 7px 0;
}

.toggle-text {
    font-size: 10px;
    color: rgba(255,255,255,.65);
}

.toggle {
    width: 34px;
    height: 18px;

    border-radius: 20px;

    background: #292c40;

    position: relative;

    cursor: pointer;

    transition: .2s;
}

.toggle::after {
    content: "";

    position: absolute;

    top: 3px;
    left: 3px;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: white;

    transition: .2s;
}

.toggle.active {
    background: #667eea;
}

.toggle.active::after {
    transform: translateX(16px);
}

/* =========================
   BUTTONS
========================= */

.action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.action-btn {
    padding: 9px;

    border: 0;
    border-radius: 8px;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    color: white;

    font-size: 10px;
    font-weight: 900;

    cursor: pointer;

    transition: .18s;
}

.action-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.12);
}

.action-btn.secondary {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
}

/* =========================
   DIVIDER
========================= */

.divider {
    height: 1px;
    background: rgba(255,255,255,.07);
}

/* =========================
   INFO
========================= */

.info {
    padding: 8px;

    border-radius: 8px;

    background: rgba(255,255,255,.035);

    text-align: center;

    font-size: 9px;

    line-height: 1.5;

    color: rgba(255,255,255,.4);
}

/* =========================
   MOBILE
========================= */

@media(max-width: 800px) {

    .main-container {
        grid-template-columns: 1fr;

        padding-top: 52px;
    }

    .controls-panel {
        position: absolute;

        left: 20px;
        right: 20px;
        bottom: 10px;

        height: 125px;

        display: grid;
        grid-template-columns:
            repeat(4, minmax(100px,1fr));

        overflow-x: auto;
        overflow-y: hidden;
    }

    .canvas-wrapper {
        margin-bottom: 135px;
    }

}

@media(max-width: 500px) {

    .header h1 {
        font-size: 18px;
    }

    .header p {
        display: none;
    }

    .main-container {
        padding: 48px 8px 8px;
    }

    .controls-panel {
        left: 8px;
        right: 8px;
    }

}
</style>
</head>

<body>

<button class="back-btn" onclick="goBack()">← Back</button>

<header class="header">
    <h1>Particle Playground</h1>
    <p>Draw something beautiful.</p>
</header>

<div class="main-container">

    <div class="canvas-wrapper">

        <canvas id="canvas"></canvas>

        <div class="canvas-hint">
            Click & drag to paint
        </div>

    </div>

    <aside class="controls-panel">

        <!-- MODE -->

        <div class="control-group">

            <div class="control-label">
                Mode
            </div>

            <div class="mode-grid">

                <button
                    class="mode-btn active"
                    data-mode="draw">
                    ✏️ Draw
                </button>

                <button
                    class="mode-btn"
                    data-mode="glow">
                    ✨ Glow
                </button>

                <button
                    class="mode-btn"
                    data-mode="aurora">
                    🌌 Aurora
                </button>

                <button
                    class="mode-btn"
                    data-mode="vortex">
                    🌀 Vortex
                </button>

                <button
                    class="mode-btn"
                    data-mode="rainbow">
                    🌈 Rainbow
                </button>

                <button
                    class="mode-btn"
                    data-mode="erase">
                    🧹 Erase
                </button>

            </div>

        </div>

        <div class="divider"></div>

        <!-- COLOUR -->

        <div class="control-group">

            <div class="control-label">
                Colour
            </div>

            <input
                type="color"
                class="color-picker"
                id="colorPicker"
                value="#667eea">

        </div>

        <div class="control-group">

            <div class="control-label">
                Presets
            </div>

            <div class="preset-colors">

                <div class="preset"
                     style="background:#ff4d6d"
                     data-color="#ff4d6d"></div>

                <div class="preset"
                     style="background:#ffd166"
                     data-color="#ffd166"></div>

                <div class="preset"
                     style="background:#6bcb77"
                     data-color="#6bcb77"></div>

                <div class="preset"
                     style="background:#4d96ff"
                     data-color="#4d96ff"></div>

                <div class="preset"
                     style="background:#f093fb"
                     data-color="#f093fb"></div>

                <div class="preset"
                     style="background:#00e5ff"
                     data-color="#00e5ff"></div>

            </div>

        </div>

        <div class="divider"></div>

        <!-- SIZE -->

        <div class="control-group">

            <div class="control-label">
                Brush
                <span class="value" id="sizeValue">6</span>
            </div>

            <input
                type="range"
                class="slider"
                id="sizeSlider"
                min="1"
                max="30"
                value="6">

        </div>

        <!-- DENSITY -->

        <div class="control-group">

            <div class="control-label">
                Density
                <span class="value" id="densityValue">5</span>
            </div>

            <input
                type="range"
                class="slider"
                id="densitySlider"
                min="1"
                max="25"
                value="5">

        </div>

        <!-- GRAVITY -->

        <div class="control-group">

            <div class="control-label">
                Gravity
                <span class="value" id="gravityValue">50%</span>
            </div>

            <input
                type="range"
                class="slider"
                id="gravitySlider"
                min="-100"
                max="200"
                value="50">

        </div>

        <!-- WIND -->

        <div class="control-group">

            <div class="control-label">
                Wind
                <span class="value" id="windValue">0</span>
            </div>

            <input
                type="range"
                class="slider"
                id="windSlider"
                min="-100"
                max="100"
                value="0">

        </div>

        <div class="divider"></div>

        <!-- TRAILS -->

        <div class="toggle-row">

            <span class="toggle-text">
                ✨ Particle Trails
            </span>

            <div
                class="toggle active"
                id="trailToggle">
            </div>

        </div>

        <div class="toggle-row">

            <span class="toggle-text">
                🌈 Rainbow Colours
            </span>

            <div
                class="toggle"
                id="rainbowToggle">
            </div>

        </div>

        <div class="divider"></div>

        <!-- BUTTONS -->

        <div class="action-buttons">

            <button
                class="action-btn"
                id="clearBtn">
                🗑 Clear
            </button>

            <button
                class="action-btn secondary"
                id="burstBtn">
                💥 Burst
            </button>

        </div>

        <div class="action-buttons">

            <button
                class="action-btn secondary"
                id="freezeBtn">
                ❄️ Freeze
            </button>

            <button
                class="action-btn secondary"
                id="blackBtn">
                🌑 Dark
            </button>

        </div>

        <div class="info">
            <b>Aurora</b> creates flowing neon ribbons.<br>
            <b>Vortex</b> bends particles around your cursor.<br>
            Try holding your mouse down and moving slowly.
        </div>

    </aside>

</div>


<script>



const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: true,
    desynchronized: true
});

/* Lower DPR = MUCH better performance */
let dpr = Math.min(window.devicePixelRatio || 1, 1.5);

let canvasWidth = 0;
let canvasHeight = 0;

function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    canvasWidth = Math.max(1, Math.floor(rect.width));
    canvasHeight = Math.max(1, Math.floor(rect.height));

    canvas.width = Math.floor(canvasWidth * dpr);
    canvas.height = Math.floor(canvasHeight * dpr);

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =====================================
   STATE
===================================== */

const state = {

    particles: [],

    mode: "draw",

    color: "#667eea",

    size: 6,

    density: 5,

    gravity: 0.5,

    wind: 0,

    trails: true,

    rainbow: false,

    frozen: false,

    dark: true,

    mouse: {
        x: 0,
        y: 0,
        down: false
    },

    hue: 0,

    /* HARD particle limit */
    maxParticles: 1400
};


/* =====================================
   PARTICLE
===================================== */

class Particle {

    constructor(x, y) {

        this.x = x;
        this.y = y;

        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            Math.random() * 2.5 + 0.5;

        this.vx =
            Math.cos(angle) * speed;

        this.vy =
            Math.sin(angle) * speed;

        this.size =
            Math.max(
                1,
                state.size * (
                    0.55 +
                    Math.random() * 0.75
                )
            );

        this.life = 1;

        this.decay =
            state.mode === "aurora"
                ? 0.0025
                : 0.008;

        this.hue =
            state.hue +
            Math.random() * 50 - 25;

        this.phase =
            Math.random() * Math.PI * 2;

        this.color =
            state.color;
    }


    update() {

        if (state.frozen)
            return;


        /* ==========================
           AURORA
        ========================== */

        if (this.mode === "aurora") {

            this.phase += 0.025;

            this.vx +=
                Math.sin(
                    this.y * 0.006 +
                    this.phase
                ) * 0.018;

            this.vy +=
                Math.cos(
                    this.x * 0.004 +
                    this.phase
                ) * 0.012;

            this.vx *= 0.992;
            this.vy *= 0.992;

            this.x += this.vx * 1.5;
            this.y += this.vy * 1.5;

        }


        /* ==========================
           VORTEX
        ========================== */

        else if (this.mode === "vortex") {

            const dx =
                state.mouse.x - this.x;

            const dy =
                state.mouse.y - this.y;

            const distanceSquared =
                dx * dx + dy * dy;

            /* Avoid expensive sqrt unless needed */

            if (distanceSquared < 90000) {

                const distance =
                    Math.sqrt(
                        distanceSquared
                    );

                const force =
                    (300 - distance) / 300;

                this.vx +=
                    (-dy / (distance || 1))
                    * force
                    * 0.25;

                this.vy +=
                    (dx / (distance || 1))
                    * force
                    * 0.25;
            }

            this.vx *= 0.987;
            this.vy *= 0.987;

            this.x += this.vx;
            this.y += this.vy;

        }


        /* ==========================
           NORMAL
        ========================== */

        else {

            this.vy +=
                state.gravity * 0.02;

            this.vx +=
                state.wind * 0.0015;

            this.vx *= 0.995;

            this.x += this.vx;
            this.y += this.vy;
        }


        this.life -= this.decay;


        /* ==========================
           WALLS
        ========================== */

        if (this.x < 0) {

            this.x = 0;
            this.vx *= -0.7;

        } else if (this.x > canvasWidth) {

            this.x = canvasWidth;
            this.vx *= -0.7;
        }


        if (this.y < 0) {

            this.y = 0;
            this.vy *= -0.7;

        } else if (this.y > canvasHeight) {

            this.y = canvasHeight;
            this.vy *= -0.7;
        }
    }


    draw() {

        let color = this.color;


        /* ==========================
           RAINBOW
        ========================== */

        if (
            state.rainbow ||
            this.mode === "rainbow"
        ) {

            color =
                `hsl(${this.hue},100%,65%)`;
        }


        /* ==========================
           ERASE
        ========================== */

        if (this.mode === "erase") {

            ctx.globalCompositeOperation =
                "destination-out";

            ctx.globalAlpha =
                Math.min(1, this.life);

            ctx.beginPath();

            ctx.arc(
                this.x,
                this.y,
                this.size * 2,
                0,
                Math.PI * 2
            );

            ctx.fill();

            return;
        }


        /* ==========================
           AURORA
        ========================== */

        if (this.mode === "aurora") {

            ctx.globalCompositeOperation =
                "lighter";

            ctx.globalAlpha =
                Math.min(
                    0.22,
                    this.life * 0.25
                );

            ctx.strokeStyle =
                color;

            ctx.lineWidth =
                Math.max(
                    1,
                    this.size * 1.7
                );

            ctx.beginPath();

            ctx.moveTo(
                this.x - this.vx * 7,
                this.y - this.vy * 7
            );

            ctx.lineTo(
                this.x + this.vx * 9,
                this.y + this.vy * 9
            );

            ctx.stroke();

            return;
        }


        /* ==========================
           NORMAL PARTICLE
        ========================== */

        ctx.globalCompositeOperation =
            (
                this.mode === "glow" ||
                this.mode === "rainbow" ||
                state.rainbow
            )
                ? "lighter"
                : "source-over";

        ctx.globalAlpha =
            Math.min(1, this.life);

        ctx.fillStyle =
            color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =====================================
   CREATE PARTICLES
===================================== */

function createParticles(x, y) {

    let amount =
        state.density;


    /* Aurora needs fewer particles */

    if (state.mode === "aurora") {

        amount =
            Math.max(
                1,
                Math.floor(
                    state.density * 0.45
                )
            );
    }


    /* Vortex needs fewer particles */

    if (state.mode === "vortex") {

        amount =
            Math.max(
                1,
                Math.floor(
                    state.density * 0.7
                )
            );
    }


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const spread =
            state.mode === "aurora"
                ? 22
                : state.size * 1.5;

        const particle =
            new Particle(
                x +
                (Math.random() - 0.5)
                * spread,

                y +
                (Math.random() - 0.5)
                * spread
            );

        particle.mode =
            state.mode;

        state.particles.push(
            particle
        );
    }


    /* Remove oldest particles efficiently */

    if (
        state.particles.length >
        state.maxParticles
    ) {

        state.particles.splice(
            0,
            state.particles.length -
            state.maxParticles
        );
    }
}


/* =====================================
   POINTER
===================================== */

function pointerPosition(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            e.clientX -
            rect.left,

        y:
            e.clientY -
            rect.top
    };
}


canvas.addEventListener(
    "pointerdown",
    e => {

        state.mouse.down = true;

        const pos =
            pointerPosition(e);

        state.mouse.x =
            pos.x;

        state.mouse.y =
            pos.y;

        createParticles(
            pos.x,
            pos.y
        );
    }
);


canvas.addEventListener(
    "pointermove",
    e => {

        const pos =
            pointerPosition(e);

        state.mouse.x =
            pos.x;

        state.mouse.y =
            pos.y;

        if (state.mouse.down) {

            createParticles(
                pos.x,
                pos.y
            );
        }
    }
);


window.addEventListener(
    "pointerup",
    () => {

        state.mouse.down = false;
    }
);


/* =====================================
   ANIMATION
===================================== */

let lastFrame = performance.now();

function animate(now) {

    const delta =
        Math.min(
            now - lastFrame,
            32
        );

    lastFrame = now;


    /* ==========================
       BACKGROUND
    ========================== */

    ctx.globalCompositeOperation =
        "source-over";

    ctx.globalAlpha = 1;

    if (state.trails) {

        ctx.fillStyle =
            state.dark
                ? "rgba(5,6,13,0.13)"
                : "rgba(255,255,255,0.13)";

        ctx.fillRect(
            0,
            0,
            canvasWidth,
            canvasHeight
        );

    } else {

        ctx.clearRect(
            0,
            0,
            canvasWidth,
            canvasHeight
        );
    }


    /* ==========================
       UPDATE + DRAW
    ========================== */

    const particles =
        state.particles;


    if (!state.frozen) {

        for (
            let i = particles.length - 1;
            i >= 0;
            i--
        ) {

            const particle =
                particles[i];

            particle.update();

            if (
                particle.life <= 0
            ) {

                /* Fast removal */

                particles[i] =
                    particles[
                        particles.length - 1
                    ];

                particles.pop();

                continue;
            }

            particle.draw();
        }

    } else {

        for (
            let i = 0;
            i < particles.length;
            i++
        ) {

            particles[i].draw();
        }
    }


    /* Reset canvas state */

    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation =
        "source-over";


    if (!state.frozen) {

        state.hue +=
            delta * 0.025;

        if (state.hue >= 360)
            state.hue -= 360;
    }


    requestAnimationFrame(
        animate
    );
}

requestAnimationFrame(
    animate
);


/* =====================================
   MODE BUTTONS
===================================== */

document
.querySelectorAll(".mode-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".mode-btn")
            .forEach(btn => {

                btn.classList.remove(
                    "active"
                );
            });

            button.classList.add(
                "active"
            );

            state.mode =
                button.dataset.mode;
        }
    );
});


/* =====================================
   COLOR
===================================== */

const colorPicker =
    document.getElementById(
        "colorPicker"
    );

colorPicker.addEventListener(
    "input",
    e => {

        state.color =
            e.target.value;
    }
);


document
.querySelectorAll(".preset")
.forEach(preset => {

    preset.addEventListener(
        "click",
        () => {

            const color =
                preset.dataset.color;

            state.color =
                color;

            colorPicker.value =
                color;
        }
    );
});


/* =====================================
   SLIDERS
===================================== */

const sizeSlider =
    document.getElementById(
        "sizeSlider"
    );

const densitySlider =
    document.getElementById(
        "densitySlider"
    );

const gravitySlider =
    document.getElementById(
        "gravitySlider"
    );

const windSlider =
    document.getElementById(
        "windSlider"
    );


sizeSlider.addEventListener(
    "input",
    e => {

        state.size =
            Number(e.target.value);

        document
        .getElementById(
            "sizeValue"
        )
        .textContent =
            state.size;
    }
);


densitySlider.addEventListener(
    "input",
    e => {

        state.density =
            Number(e.target.value);

        document
        .getElementById(
            "densityValue"
        )
        .textContent =
            state.density;
    }
);


gravitySlider.addEventListener(
    "input",
    e => {

        state.gravity =
            Number(e.target.value)
            / 100;

        document
        .getElementById(
            "gravityValue"
        )
        .textContent =
            e.target.value + "%";
    }
);


windSlider.addEventListener(
    "input",
    e => {

        state.wind =

        document
        .getElementById(
            "windValue"
        )
        .textContent =
            e.target.value;
    }
);


/* =====================================
   TRAILS
===================================== */

document
.getElementById("trailToggle")
.addEventListener(
    "click",
    function () {

        state.trails =
            !state.trails;

        this.classList.toggle(
            "active",
            state.trails
        );
    }
);


/* =====================================
   RAINBOW
===================================== */

document
.getElementById("rainbowToggle")
.addEventListener(
    "click",
    function () {

        state.rainbow =
            !state.rainbow;

        this.classList.toggle(
            "active",
            state.rainbow
        );
    }
);


/* =====================================
   CLEAR
===================================== */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    () => {

        state.particles.length = 0;

        ctx.clearRect(
            0,
            0,
            canvasWidth,
            canvasHeight
        );
    }
);


/* =====================================
   BURST
===================================== */

document
.getElementById("burstBtn")
.addEventListener(
    "click",
    () => {

        const x =
            canvasWidth / 2;

        const y =
            canvasHeight / 2;


        const amount =
            Math.min(
                120,
                state.maxParticles -
                state.particles.length
            );


        for (
            let i = 0;
            i < amount;
            i++
        ) {

            const particle =
                new Particle(x, y);

            particle.mode =
                state.mode;

            state.particles.push(
                particle
            );
        }
    }
);


/* =====================================
   FREEZE
===================================== */

const freezeBtn =
    document.getElementById(
        "freezeBtn"
    );

freezeBtn.addEventListener(
    "click",
    () => {

        state.frozen =
            !state.frozen;

        freezeBtn.textContent =
            state.frozen
                ? "▶ Resume"
                : "❄️ Freeze";
    }
);


/* =====================================
   DARK / LIGHT
===================================== */

document
.getElementById("blackBtn")
.addEventListener(
    "click",
    () => {

        state.dark =
            !state.dark;

        canvas.style.background =
            state.dark
                ? "#05060d"
                : "#ffffff";
    }
);


/* =====================================
   KEYBOARD
===================================== */

document.addEventListener(
    "keydown",
    e => {

        const key =
            e.key.toLowerCase();


        if (key === " ") {

            e.preventDefault();

            freezeBtn.click();
        }


        if (key === "c") {

            document
            .getElementById(
                "clearBtn"
            )
            .click();
        }


        if (key === "b") {

            document
            .getElementById(
                "burstBtn"
            )
            .click();
        }


        if (key === "a") {

            document
            .querySelector(
                '[data-mode="aurora"]'
            )
            .click();
        }
    }
);


/* =====================================
   INITIAL BACKGROUND
===================================== */

ctx.fillStyle =
    "#05060d";

ctx.fillRect(
    0,
    0,
    canvasWidth,
    canvasHeight
);


/* =====================================
   BACK
===================================== */

function goBack() {

    window.location.href =
        "index.html";
}
