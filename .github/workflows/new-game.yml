name: Announce New Game

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "**/*.html"

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new HTML files
        id: games
        shell: bash
        run: |
          set -e

          echo "Checking for newly added HTML files..."

          NEW_FILES=$(git diff --name-status HEAD^ HEAD | awk '$1 == "A" && $2 ~ /\.html$/ {print $2}')

          if [ -z "$NEW_FILES" ]; then
            echo "No new HTML games found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New HTML files:"
          echo "$NEW_FILES"

          echo "found=true" >> "$GITHUB_OUTPUT"

          {
            echo "files<<EOF"
            echo "$NEW_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord announcements
        if: steps.games.outputs.found == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NEW_FILES: ${{ steps.games.outputs.files }}
        shell: python
        run: |
          import os
          import json
          import urllib.request
          import urllib.parse

          webhook = os.environ["DISCORD_WEBHOOK"]

          files = [
              x.strip()
              for x in os.environ["NEW_FILES"].splitlines()
              if x.strip()
          ]

          for file in files:

              # Remove .html
              filename = os.path.splitext(os.path.basename(file))[0]

              # Convert filename into a readable name
              game_name = filename.replace("-", " ").replace("_", " ")

              # Capitalise words
              game_name = game_name.title()

              # Change this if your GitHub Pages URL is different
              game_url = (
                  "https://crypticfn2012-jpg.github.io/Ron.cool/"
                  + urllib.parse.quote(file)
              )

              # Change this to the actual image URL for your game's PFP.
              # This example expects:
              # images/games/GAMENAME.png
              image_name = filename.lower()
              image_url = (
                  "https://crypticfn2012-jpg.github.io/Ron.cool/"
                  "images/games/"
                  + urllib.parse.quote(image_name)
                  + ".png"
              )

              embed = {
                  "title": "🎮 New Game Added!",
                  "description": (
                      f"**{game_name}** has just been added to Ron.cool!\n\n"
                      "Go play it now 👇"
                  ),
                  "url": game_url,
                  "color": 5569484,
                  "thumbnail": {
                      "url": image_url
                  },
                  "footer": {
                      "text": "Ron.cool • New Game"
                  }
              }

              payload = {
                  "username": "Ron.cool",
                  "embeds": [embed]
              }

              data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Ron.cool GitHub Actions"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      print(
                          f"Discord announcement sent for {game_name}: "
                          f"{response.status}"
                      )
              except Exception as error:
                  print(
                      f"Failed to send announcement for {game_name}: "
                      f"{error}"
                  )
                  raise
