name: New Game Discord Announcement

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "games.json"
      - "icons/**"

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new games
        id: games
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess

          print("================================")
          print("RON.COOL GAME DETECTOR")
          print("================================")

          # Get files added in this commit
          try:
              result = subprocess.run(
                  ["git", "diff", "--name-status", "HEAD^", "HEAD"],
                  capture_output=True,
                  text=True,
                  check=True
              )

              changed_files = result.stdout.splitlines()

          except Exception as e:
              print("Could not check git changes:", e)
              changed_files = []

          print("Changed files:")
          print(changed_files)

          new_html_files = []

          for line in changed_files:

              parts = line.split("\t")

              if len(parts) < 2:
                  continue

              status = parts[0]
              filename = parts[-1]

              if status == "A" and filename.lower().endswith(".html"):

                  # Ignore website homepage
                  if filename.lower() == "index.html":
                      continue

                  print("New HTML game found:", filename)

                  new_html_files.append(filename)

          # Load games.json
          try:

              with open(
                  "games.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  games_data = json.load(f)

          except Exception as e:

              print("Could not load games.json:", e)

              games_data = []

          # games.json can be either:
          #
          # {
          #   "name": "...",
          #   ...
          # }
          #
          # OR:
          #
          # [
          #   {...},
          #   {...}
          # ]

          if isinstance(games_data, dict):

              games = [games_data]

          elif isinstance(games_data, list):

              games = [
                  game
                  for game in games_data
                  if isinstance(game, dict)
              ]

          else:

              games = []

          print("Games in games.json:", len(games))

          detected_games = []

          for filename in new_html_files:

              matching_game = None

              for game in games:

                  if game.get("file") == filename:

                      matching_game = game
                      break

              if matching_game:

                  print(
                      "Matched:",
                      matching_game.get("name"),
                      "->",
                      filename
                  )

                  detected_games.append(
                      matching_game
                  )

              else:

                  print(
                      "WARNING: No games.json entry for",
                      filename
                  )

                  # Create fallback game
                  filename_without_extension = os.path.splitext(
                      os.path.basename(filename)
                  )[0]

                  fallback_name = (
                      filename_without_extension
                      .replace("_", " ")
                      .replace("-", " ")
                      .title()
                  )

                  detected_games.append({

                      "id": filename_without_extension,

                      "name": fallback_name,

                      "file": filename,

                      "icon": "favicon.ico",

                      "description":
                          "A new game has been added to Ron.cool!"

                  })

          output = os.environ["GITHUB_OUTPUT"]

          with open(
              output,
              "a",
              encoding="utf-8"
          ) as f:

              f.write(
                  "games="
                  + json.dumps(detected_games)
                  + "\n"
              )

              f.write(
                  "count="
                  + str(len(detected_games))
                  + "\n"
              )

          print("")
          print("Detected games:")
          print(
              json.dumps(
                  detected_games,
                  indent=2
              )
          )

          PY

      - name: Send Discord announcements
        if: steps.games.outputs.count != '0'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NEW_GAMES: ${{ steps.games.outputs.games }}
        shell: bash
        run: |
          python3 <<'PY'

          import json
          import os
          import urllib.request

          webhook = os.environ.get(
              "DISCORD_WEBHOOK"
          )

          if not webhook:

              print(
                  "ERROR: DISCORD_WEBHOOK secret is missing!"
              )

              raise SystemExit(1)

          games = json.loads(
              os.environ["NEW_GAMES"]
          )

          print(
              "Sending",
              len(games),
              "game announcement(s)..."
          )

          for game in games:

              name = game.get(
                  "name",
                  "New Game"
              )

              description = game.get(
                  "description",
                  "A new game has been added to Ron.cool!"
              )

              filename = game.get(
                  "file",
                  ""
              )

              icon = game.get(
                  "icon",
                  "favicon.ico"
              )

              # Remove accidental leading slash
              filename = filename.lstrip("/")
              icon = icon.lstrip("/")

              # Your actual game URL
              game_url = (
                  "https://roncool.cc.cd/"
                  + filename
              )

              # Your actual icon URL
              icon_url = (
                  "https://roncool.cc.cd/"
                  + icon
              )

              payload = {

                  "username":
                      "Ron.cool",

                  "avatar_url":
                      "https://roncool.cc.cd/favicon.ico",

                  "content":
                      "🎮 **A new game just dropped on Ron.cool!**",

                  "embeds": [

                      {

                          "title":
                              "🎮 " + name,

                          "description":
                              description,

                          "url":
                              game_url,

                          "color":
                              5630156,

                          "thumbnail": {

                              "url":
                                  icon_url

                          },

                          "fields": [

                              {

                                  "name":
                                      "🎮 Play Game",

                                  "value":
                                      f"[**Open {name} →**]({game_url})",

                                  "inline":
                                      False

                              }

                          ],

                          "footer": {

                              "text":
                                  "Ron.cool • New Game"

                          }

                      }

                  ]

              }

              data = json.dumps(
                  payload
              ).encode("utf-8")

              request = urllib.request.Request(

                  webhook,

                  data=data,

                  headers={
                      "Content-Type":
                          "application/json"
                  },

                  method="POST"

              )

              try:

                  with urllib.request.urlopen(
                      request
                  ) as response:

                      print(
                          "Discord response:",
                          response.status
                      )

              except Exception as e:

                  print(
                      "Discord webhook failed:",
                      e
                  )

                  raise

          PY
