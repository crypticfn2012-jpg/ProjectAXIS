name: Ron.cool New Game

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "**/*.html"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  new-game:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find new HTML files
        id: files
        run: |
          git diff --name-status HEAD^ HEAD > changes.txt

          echo "===== CHANGES ====="
          cat changes.txt
          echo "==================="

          files=$(awk '$1 == "A" && $2 ~ /\.html$/ {print $2}' changes.txt)

          if [ -z "$files" ]; then
            echo "No new HTML files."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New HTML files:"
          echo "$files"

          echo "found=true" >> "$GITHUB_OUTPUT"

          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update games.json
        if: steps.files.outputs.found == 'true'
        env:
          NEW_FILES: ${{ steps.files.outputs.files }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re

          FILE = "games.json"

          # -----------------------------
          # Load games.json
          # -----------------------------

          if os.path.exists(FILE):
              try:
                  with open(FILE, "r", encoding="utf-8") as f:
                      games = json.load(f)
              except Exception:
                  games = []
          else:
              games = []

          # Convert old single-object format
          # into the new list format
          if isinstance(games, dict):
              games = [games]

          if not isinstance(games, list):
              games = []

          # -----------------------------
          # Process new games
          # -----------------------------

          new_files = os.environ["NEW_FILES"].splitlines()

          for filepath in new_files:

              filepath = filepath.strip()

              if not filepath:
                  continue

              filename = os.path.basename(filepath)
              slug = os.path.splitext(filename)[0]

              # -------------------------
              # Read HTML
              # -------------------------

              try:
                  with open(
                      filepath,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:
                      html = f.read()
              except Exception as e:
                  print("Could not read:", filepath)
                  print(e)
                  continue

              # -------------------------
              # Find title
              # -------------------------

              match = re.search(
                  r"<title[^>]*>(.*?)</title>",
                  html,
                  re.IGNORECASE | re.DOTALL
              )

              if match:
                  name = match.group(1)
                  name = re.sub(r"\s+", " ", name).strip()

                  # Remove Ron.cool suffix
                  name = re.sub(
                      r"\s*\|\s*Ron\.cool\s*$",
                      "",
                      name,
                      flags=re.IGNORECASE
                  ).strip()
              else:
                  name = slug.replace("-", " ").replace("_", " ").title()

              # -------------------------
              # ID
              # -------------------------

              game_id = re.sub(
                  r"[^a-z0-9-]+",
                  "-",
                  name.lower()
              ).strip("-")

              # -------------------------
              # Icon
              # -------------------------

              icon = f"icons/{slug}.png"

              # -------------------------
              # Description
              # -------------------------

              description = f"Play {name} on Ron.cool."

              # -------------------------
              # Check duplicate
              # -------------------------

              already_exists = False

              for game in games:

                  if not isinstance(game, dict):
                      continue

                  if game.get("file") == filename:
                      already_exists = True
                      break

              if already_exists:
                  print("Already exists:", filename)
                  continue

              # -------------------------
              # Add game
              # -------------------------

              game = {
                  "id": game_id,
                  "name": name,
                  "file": filename,
                  "icon": icon,
                  "description": description
              }

              games.append(game)

              print("Added game:")
              print(json.dumps(game, indent=2))

          # -----------------------------
          # Save
          # -----------------------------

          with open(
              FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  games,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")

          print("games.json updated successfully.")
          PY

      - name: Commit games.json
        if: steps.files.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Auto update games.json"
            git push
          fi

      - name: Discord announcement
        if: steps.files.outputs.found == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NEW_FILES: ${{ steps.files.outputs.files }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import re

          webhook = os.environ.get("DISCORD_WEBHOOK")

          if not webhook:
              raise Exception(
                  "DISCORD_WEBHOOK secret DOES NOT EXIST."
              )

          files = [
              x.strip()
              for x in os.environ["NEW_FILES"].splitlines()
              if x.strip()
          ]

          for filepath in files:

              filename = os.path.basename(filepath)
              slug = os.path.splitext(filename)[0]

              # -----------------------------
              # Read game HTML
              # -----------------------------

              try:
                  with open(
                      filepath,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:
                      html = f.read()
              except Exception:
                  html = ""

              # -----------------------------
              # Get actual name
              # -----------------------------

              match = re.search(
                  r"<title[^>]*>(.*?)</title>",
                  html,
                  re.IGNORECASE | re.DOTALL
              )

              if match:

                  name = match.group(1)

                  name = re.sub(
                      r"\s+",
                      " ",
                      name
                  ).strip()

                  name = re.sub(
                      r"\s*\|\s*Ron\.cool\s*$",
                      "",
                      name,
                      flags=re.IGNORECASE
                  ).strip()

              else:

                  name = (
                      slug
                      .replace("-", " ")
                      .replace("_", " ")
                      .title()
                  )

              # -----------------------------
              # URLs
              # -----------------------------

              base = "https://roncool.cc.cd/"

              game_url = (
                  base +
                  urllib.parse.quote(filepath)
              )

              icon_url = (
                  base +
                  "icons/" +
                  urllib.parse.quote(slug) +
                  ".png"
              )

              # -----------------------------
              # Discord
              # -----------------------------

              payload = {
                  "username": "Ron.cool",

                  "embeds": [
                      {
                          "title": "🎮 New Game Added!",

                          "description": (
                              f"**{name}** is now live on Ron.cool!\n\n"
                              f"🚀 **[PLAY NOW]({game_url})**"
                          ),

                          "url": game_url,

                          "color": 5630156,

                          "thumbnail": {
                              "url": icon_url
                          },

                          "footer": {
                              "text": "Ron.cool • New Game"
                          }
                      }
                  ]
              }

              data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Ron.cool GitHub Action"
                  },
                  method="POST"
              )

              print("Sending Discord announcement for:", name)

              with urllib.request.urlopen(request) as response:
                  print(
                      "Discord status:",
                      response.status
                  )
          PY
