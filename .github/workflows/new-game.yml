name: New Game Discord Announcement

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "games.json"
      - "icons/**"

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new HTML games
        id: games
        shell: python
        run: |
          import json
          import os
          import subprocess

          # Get files changed in this commit
          try:
              changed = subprocess.check_output(
                  ["git", "diff", "--name-status", "HEAD^", "HEAD"],
                  text=True
              ).splitlines()
          except Exception:
              changed = []

          new_games = []

          # Find newly added .html files
          for line in changed:
              parts = line.split("\t")

              if len(parts) < 2:
                  continue

              status = parts[0]
              file = parts[-1]

              if status == "A" and file.endswith(".html"):
                  # Ignore index.html
                  if file.lower() == "index.html":
                      continue

                  # Ignore blog if wanted
                  if file.lower() == "blog.html":
                      continue

                  new_games.append({
                      "file": file
                  })

          # Read games.json if it exists
          try:
              with open("games.json", "r", encoding="utf-8") as f:
                  games_data = json.load(f)
          except Exception:
              games_data = {}

          # Convert single object into list
          if isinstance(games_data, dict):
              games_list = [games_data]
          elif isinstance(games_data, list):
              games_list = games_data
          else:
              games_list = []

          # Match newly added HTML files against games.json
          final_games = []

          for new_game in new_games:

              file = new_game["file"]

              matching = None

              for game in games_list:

                  if not isinstance(game, dict):
                      continue

                  if game.get("file") == file:
                      matching = game
                      break

              if matching:
                  final_games.append(matching)

              else:
                  # Fallback if games.json wasn't updated
                  filename = os.path.splitext(
                      os.path.basename(file)
                  )[0]

                  readable_name = filename.replace("-", " ").replace("_", " ").title()

                  final_games.append({
                      "name": readable_name,
                      "file": file,
                      "icon": "favicon.ico",
                      "description": "A new game has been added to Ron.cool!"
                  })

          output_file = os.environ["GITHUB_OUTPUT"]

          with open(output_file, "a", encoding="utf-8") as output:

              output.write(
                  "games=" +
                  json.dumps(final_games) +
                  "\n"
              )

              output.write(
                  "count=" +
                  str(len(final_games)) +
                  "\n"
              )

          print("New games detected:")
          print(json.dumps(final_games, indent=2))


      - name: Announce new games
        if: steps.games.outputs.count != '0'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NEW_GAMES: ${{ steps.games.outputs.games }}
        shell: python
        run: |

          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK"]

          games = json.loads(
              os.environ["NEW_GAMES"]
          )

          for game in games:

              name = game.get(
                  "name",
                  "New Game"
              )

              description = game.get(
                  "description",
                  "A new game has been added to Ron.cool!"
              )

              file = game.get(
                  "file",
                  ""
              )

              icon = game.get(
                  "icon",
                  "favicon.ico"
              )

              # Game URL
              game_url = (
                  "https://roncool.cc.cd/"
                  + file
              )

              # Icon URL
              icon_url = (
                  "https://roncool.cc.cd/"
                  + icon
              )

              payload = {

                  "username": "Ron.cool",

                  "avatar_url":
                      "https://roncool.cc.cd/favicon.ico",

                  "embeds": [

                      {

                          "title":
                              "🎮 New Game Released!",

                          "description":
                              "**"
                              + name
                              + "**\n\n"
                              + description,

                          "url":
                              game_url,

                          "color":
                              5630156,

                          "thumbnail": {

                              "url":
                                  icon_url

                          },

                          "footer": {

                              "text":
                                  "Ron.cool • New Game"

                          }

                      }

                  ]

              }

              data = json.dumps(
                  payload
              ).encode("utf-8")

              request = urllib.request.Request(

                  webhook,

                  data=data,

                  headers={
                      "Content-Type":
                          "application/json"
                  },

                  method="POST"

              )

              with urllib.request.urlopen(
                  request
              ) as response:

                  print(
                      "Discord response:",
                      response.status
                  )
