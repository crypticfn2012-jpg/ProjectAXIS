name: Announce New Game

on:
  push:
    branches:
      - main
    paths:
      - "games.json"

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Announce latest game
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          # ============================================
          # GET DISCORD WEBHOOK
          # ============================================

          webhook = os.environ.get("DISCORD_WEBHOOK")

          if not webhook:
              print("ERROR: DISCORD_WEBHOOK secret is missing.")
              exit(1)

          # ============================================
          # LOAD games.json
          # ============================================

          try:
              with open("games.json", "r", encoding="utf-8") as f:
                  game = json.load(f)
          except FileNotFoundError:
              print("ERROR: games.json was not found.")
              exit(1)
          except json.JSONDecodeError as e:
              print("ERROR: games.json contains invalid JSON.")
              print(e)
              exit(1)

          # ============================================
          # MAKE SURE IT IS AN OBJECT
          # ============================================

          if not isinstance(game, dict):
              print("ERROR: games.json must contain ONE game object.")
              exit(1)

          # ============================================
          # GAME NAME
          # ============================================

          name = game.get("name")

          if not name:
              print("ERROR: games.json is missing 'name'.")
              exit(1)

          # ============================================
          # GAME LINK
          # ============================================

          link = game.get("link")

          if not link:
              html = game.get("html")

              if html:
                  link = f"https://roncool.cc.cd/{html}"
              else:
                  link = "https://roncool.cc.cd/"

          # ============================================
          # IMAGE
          # ============================================

          image = game.get("image")

          # ============================================
          # DESCRIPTION
          # ============================================

          description = game.get(
              "description",
              "A new game has just been added to Ron.cool!"
          )

          # ============================================
          # DISCORD EMBED
          # ============================================

          embed = {
              "title": f"🎮 New Game Added — {name}",
              "description": description,
              "url": link,
              "color": 5569484,
              "fields": [
                  {
                      "name": "🎯 Play Now",
                      "value": f"[Play {name}]({link})",
                      "inline": True
                  }
              ],
              "footer": {
                  "text": "Ron.cool • New Game"
              }
          }

          # Add game PFP
          if image:
              embed["thumbnail"] = {
                  "url": image
              }

          payload = {
              "username": "Ron.cool",
              "embeds": [embed]
          }

          # ============================================
          # SEND TO DISCORD
          # ============================================

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Ron.cool Game Announcer"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord announcement sent!")
                  print("HTTP status:", response.status)

          except Exception as e:
              print("ERROR: Failed to send Discord announcement.")
              print(e)
              exit(1)
          PY
