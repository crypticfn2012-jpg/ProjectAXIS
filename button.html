<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Do Not Press The Button</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}

/* BACK BUTTON */
.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    background: #00ffcc;
    color: black;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    z-index: 1000;
}
.back-btn:hover {
    background: #00ddb3;
}

/* MAIN */
h1 {
    margin-top: 80px;
}

#button {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: none;
    font-size: 18px;
    color: white;
    cursor: pointer;
    margin-top: 40px;
    box-shadow: 0 0 30px currentColor;
    transition: 0.15s;
}

#button:active {
    transform: scale(0.9);
}

#message {
    margin-top: 40px;
    font-size: 22px;
    min-height: 40px;
}

#stats {
    margin-top: 20px;
}

/* unlock panel */
#shop {
    margin-top: 30px;
}

.colorBtn {
    padding: 6px 10px;
    margin: 4px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
}
</style>
</head>

<body>

<button class="back-btn" onclick="goBack()">⬅ Back</button>

<h1>DO NOT PRESS</h1>

<button id="button">PRESS</button>

<div id="message">I wouldn't do that...</div>

<div id="stats">
Clicks: <span id="clicks">0</span> |
Money: £<span id="money">0</span>
</div>

<div id="shop">
<h3>Unlock Colors</h3>
<div id="colors"></div>
</div>

<script>
let clicks = 0;
let money = 0;
let unlockedColors = ["red"];
let currentColor = "red";

const btn = document.getElementById("button");
const msg = document.getElementById("message");

/* ========= LOAD SAVE ========= */
function load() {
    const save = JSON.parse(localStorage.getItem("buttonGame"));
    if(save){
        clicks = save.clicks;
        money = save.money;
        unlockedColors = save.colors;
        currentColor = save.current;
    }
}
load();

/* ========= SAVE ========= */
function save(){
    localStorage.setItem("buttonGame", JSON.stringify({
        clicks, money, colors: unlockedColors, current: currentColor
    }));
}

/* ========= SMART EVENTS ========= */
function getEvent() {
    if(clicks < 5){
        return "You’re just getting started...";
    }

    if(clicks > 50 && Math.random() < 0.2){
        return "You’ve clicked this WAY too much...";
    }

    if(money < 0){
        return "You're broke 💀";
    }

    const pool = [
        {text:"+£10", val:10},
        {text:"-£5", val:-5},
        {text:"+£50 JACKPOT", val:50},
        {text:"Nothing happened"},
        {text:"The button is watching you 👁️"},
        {text:"You feel lucky 🍀"},
        {text:"You feel cursed 💀", val:-10},
    ];

    return pool[Math.floor(Math.random()*pool.length)];
}

/* ========= CLICK ========= */
btn.onclick = () => {
    clicks++;

    const event = getEvent();

    if(typeof event === "string"){
        msg.innerText = event;
    } else {
        msg.innerText = event.text;
        money += event.val || 0;
    }

    /* dynamic weirdness */
    if(clicks === 10){
        msg.innerText = "Why are you still pressing it?";
    }
    if(clicks === 25){
        msg.innerText = "It won’t stop you know...";
    }
    if(clicks === 100){
        msg.innerText = "You need help.";
    }

    update();
    unlockColorsCheck();
    save();
};

/* ========= COLORS ========= */
const colorList = [
    {name:"blue", cost:50},
    {name:"green", cost:100},
    {name:"purple", cost:200},
    {name:"gold", cost:500}
];

function unlockColorsCheck(){
    const container = document.getElementById("colors");
    container.innerHTML = "";

    colorList.forEach(c=>{
        const b = document.createElement("button");
        b.className = "colorBtn";
        b.innerText = c.name + " (£"+c.cost+")";

        if(unlockedColors.includes(c.name)){
            b.innerText = "Use " + c.name;
            b.onclick = () => {
                currentColor = c.name;
                applyColor();
                save();
            };
        } else {
            b.onclick = () => {
                if(money >= c.cost){
                    money -= c.cost;
                    unlockedColors.push(c.name);
                    save();
                    unlockColorsCheck();
                } else {
                    msg.innerText = "Not enough money!";
                }
            };
        }

        container.appendChild(b);
    });
}

function applyColor(){
    btn.style.background = currentColor;
    btn.style.color = (currentColor === "gold") ? "black" : "white";
}

function update(){
    document.getElementById("clicks").innerText = clicks;
    document.getElementById("money").innerText = money;
}

/* ========= BACK ========= */
function goBack(){
    window.location.href = "../../index.html";
}

/* init */
applyColor();
update();
unlockColorsCheck();
</script>

</body>
</html>
