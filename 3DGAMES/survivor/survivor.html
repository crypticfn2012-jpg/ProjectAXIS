<body>

<div id="unity-container">

    <canvas id="unity-canvas"
            width="960"
            height="600"
            tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">
        <div id="loading-title">SURVIV0R</div>

        <div id="loading-subtitle">
            INITIALIZING SURVIVAL SYSTEM
        </div>

            <div id="unity-progress-bar-full"></div>
        </div>
    </div>

    <div id="unity-warning"></div>

    <div id="game-overlay">
        <div id="top-left">RON.COOL // SURVIV0R</div>

        <button id="fullscreen">
            FULLSCREEN
        </button>
    </div>

</div>

<script>

const canvas = document.getElementById("unity-canvas");
const loadingBar = document.getElementById("unity-loading-bar");
const progressBar = document.getElementById("unity-progress-bar-full");
const warningBanner = document.getElementById("unity-warning");
const fullscreenButton = document.getElementById("fullscreen");


/* -------------------------------------------------------
   UNITY WARNING
------------------------------------------------------- */

function unityShowBanner(message, type) {

    const div = document.createElement("div");

    div.innerHTML = message;

    div.style.padding = "12px";
    div.style.marginBottom = "5px";
    div.style.borderRadius = "5px";
    div.style.fontFamily = "Arial";

    if (type === "error") {
        div.style.background = "#b00000";
        div.style.color = "white";
    } else {
        div.style.background = "#c89000";
        div.style.color = "black";
    }

    warningBanner.appendChild(div);

    if (type !== "error") {
        setTimeout(() => {
            if (div.parentNode) {
                div.remove();
            }
        }, 5000);
    }
}


/* -------------------------------------------------------
   BUILD PATHS
------------------------------------------------------- */

const buildUrl = "Build";

const loaderUrl =
    buildUrl + "/SURVIV0R.loader.js";


/*
    IMPORTANT:

    This points to the RAW GitHub copy of the compressed
    WASM file.

    However, GitHub Raw does NOT automatically provide the
    Content-Encoding header Unity expects for a .gz file.

    Therefore we download and decompress it ourselves.
*/

const wasmGzipUrl =
    "https://raw.githubusercontent.com/crypticfn2012-jpg/ProjectAXIS/refs/heads/main/3DGAMES/survivor/Build/SURVIV0R.wasm.gz";


/* -------------------------------------------------------
   FETCH + DECOMPRESS WASM
------------------------------------------------------- */

async function loadWasm() {

    const response = await fetch(wasmGzipUrl);

    if (!response.ok) {
        throw new Error(
            "Failed to download SURVIV0R.wasm.gz: HTTP " +
            response.status
        );
    }

    const compressed = await response.arrayBuffer();

    /*
        DecompressionStream is supported by modern
        Chromium/Edge/Chrome browsers.
    */

    if (!("DecompressionStream" in window)) {
        throw new Error(
            "This browser does not support GZIP decompression."
        );
    }

    const stream =
        new Blob([compressed])
            .stream()
            .pipeThrough(
                new DecompressionStream("gzip")
            );

    const decompressed =
        await new Response(stream).arrayBuffer();

    return decompressed;
}


/* -------------------------------------------------------
   LOAD UNITY
------------------------------------------------------- */

loadingBar.style.display = "block";

const script = document.createElement("script");

script.src = loaderUrl;

script.onload = async () => {

    try {

        /*
            Download and decompress WASM first.
        */

        const wasmBinary =
            await loadWasm();


        /*
            Unity's generated loader normally downloads
            the WASM itself.

            We intercept the WASM URL and provide the
            already-decompressed binary.
        */

        const config = {

            arguments: [],

            dataUrl:
                buildUrl + "/SURVIV0R.data",

            frameworkUrl:
                buildUrl + "/SURVIV0R.framework.js",

            /*
                Dummy URL.

                The actual WASM is supplied through
                wasmBinary below.
            */

            codeUrl:
                buildUrl + "/SURVIV0R.wasm",

            streamingAssetsUrl:
                "StreamingAssets",

            companyName:
                "Ron.cool",

            productName:
                "SURVIV0R",

            productVersion:
                "0.1.0",

            showBanner:
                unityShowBanner,

            wasmBinary:
                wasmBinary
        };


        /*
            Start Unity.
        */

        const unityInstance =
            await createUnityInstance(
                canvas,
                config,
                (progress) => {

                    progressBar.style.width =
                        (progress * 100) + "%";

                }
            );


        /*
            Hide loader.
        */

        loadingBar.style.display = "none";


        /*
            Fullscreen.
        */

        fullscreenButton.onclick = () => {

            unityInstance.SetFullscreen(1);

        };


        /*
            Double-click canvas = fullscreen.
        */

        canvas.addEventListener(
            "dblclick",
            () => {
                unityInstance.SetFullscreen(1);
            }
        );


        console.log(
            "SURVIV0R successfully loaded."
        );

    }

    catch (error) {

        console.error(
            "SURVIV0R failed to start:",
            error
        );

        loadingBar.innerHTML = `
            <div style="
                color:#ff4444;
                font-family:Arial;
                font-size:14px;
                line-height:1.6;
            ">
                <strong>FAILED TO LOAD SURVIV0R</strong>
                <br><br>
                ${error.message}
            </div>
        `;

    }

};


/* -------------------------------------------------------
   LOAD UNITY LOADER SCRIPT
------------------------------------------------------- */

document.body.appendChild(script);


/* -------------------------------------------------------
   RESIZE
------------------------------------------------------- */

function resizeCanvas() {

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();

</script>

</body>
</html>
