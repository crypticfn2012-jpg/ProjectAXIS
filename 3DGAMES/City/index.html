<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Shape Playground | ron.cool</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: Arial, sans-serif;
            background: #111;
        }

        canvas {
            display: block;
        }

        /* BACK BUTTON */

        .back-btn {
            position: fixed;

            top: 15px;
            left: 15px;

            background: #00ffcc;
            color: black;

            border: none;

            padding: 8px 14px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

            z-index: 9999;

            transition: 0.2s;
        }

        .back-btn:hover {
            background: #00ddb3;
            transform: scale(1.05);
        }

        .back-btn:active {
            transform: scale(0.95);
        }


        /* CONTROL PANEL */

        #ui {
            position: fixed;

            left: 10px;
            bottom: 10px;

            background: rgba(0, 0, 0, 0.75);

            padding: 14px;

            border-radius: 10px;

            color: white;

            z-index: 9999;

            backdrop-filter: blur(6px);

            box-shadow:
                0 5px 30px rgba(0, 0, 0, 0.4);
        }


        #ui-title {
            font-size: 16px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        #shape-buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 5px;
        }


        #shape-buttons button {
            background: #222;

            color: white;

            border: 1px solid #444;

            padding: 7px 10px;

            border-radius: 6px;

            cursor: pointer;

            transition: 0.15s;
        }


        #shape-buttons button:hover {
            background: #00ffcc;

            color: black;
        }


        #color-row {
            margin-top: 10px;

            display: flex;

            align-items: center;

            gap: 8px;
        }


        #colorPicker {
            width: 45px;

            height: 30px;

            padding: 0;

            border: none;

            cursor: pointer;
        }
    </style>
</head>


<body>


    <!-- BACK BUTTON -->

    <button
        class="back-btn"
        id="backButton"
        type="button"
    >
        ⬅ Back
    </button>


    <!-- CONTROL PANEL -->

    <div id="ui">

        <div id="ui-title">
            3D Shape Playground
        </div>


        <div id="shape-buttons">

            <button
                type="button"
                onclick="setShape('cube')"
            >
                Cube
            </button>


            <button
                type="button"
                onclick="setShape('sphere')"
            >
                Sphere
            </button>


            <button
                type="button"
                onclick="setShape('torus')"
            >
                Torus
            </button>


            <button
                type="button"
                onclick="setShape('cone')"
            >
                Cone
            </button>

        </div>


        <div id="color-row">

            <span>Color:</span>

            <input
                type="color"
                id="colorPicker"
                value="#00ffcc"
            >

        </div>

    </div>


    <!-- MAIN THREE.JS FILE -->

    <script
        type="module"
        src="./main.js"
    ></script>


    <!-- BACK BUTTON -->

    <script>
        document
            .getElementById("backButton")
            .addEventListener("click", function () {

                window.location.href = "../../index.html";

            });
    </script>


</body>
</html>
