<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller | ron.cool</title>
    <style>
        .back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    background: #00ffcc;
    color: black;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    z-index: 1000;
    transition: 0.2s;
}

.back-btn:hover {
    background: #00ddb3;
    transform: scale(1.05);
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .dice-display {
            text-align: center;
            margin: 40px 0;
        }

        .dice {
            font-size: 120px;
            margin: 20px 0;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            transition: transform 0.1s ease;
        }

        .dice.rolling {
            animation: rollDice 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes rollDice {
            0% {
                transform: rotateX(0deg) rotateY(0deg) scale(1);
            }
            25% {
                transform: rotateX(720deg) rotateY(360deg) scale(1.1);
            }
            50% {
                transform: rotateX(1440deg) rotateY(720deg) scale(1.15);
            }
            75% {
                transform: rotateX(2160deg) rotateY(1080deg) scale(1.1);
            }
            100% {
                transform: rotateX(0deg) rotateY(0deg) scale(1);
            }
        }

        .result {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dice-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .dice-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .dice-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .dice-btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .roll-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            margin: 20px 0;
        }

        .roll-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .roll-button:active {
            transform: translateY(0);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }

        .stat-box {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #667eea;
            font-size: 24px;
            font-weight: bold;
        }

        .history {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .history-title {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-item {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .history-item .roll-num {
            font-weight: bold;
            color: #667eea;
        }

        .clear-btn {
            width: 100%;
            padding: 10px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: #ff5252;
        }

        .combo-text {
            text-align: center;
            color: #764ba2;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
            margin: 10px 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .dice {
                font-size: 80px;
                height: 100px;
            }

            .result {
                font-size: 36px;
            }

            .dice-selector {
                gap: 8px;
            }

            .dice-btn {
                padding: 8px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
    <div class="container">
        <div class="header">
            <h1>Dice Roller</h1>
            <p>Roll infinite dice and chase that lucky streak</p>
        </div>

        <div class="dice-selector">
            <button class="dice-btn active" data-dice="d6">D6</button>
            <button class="dice-btn" data-dice="d20">D20</button>
            <button class="dice-btn" data-dice="d100">D100</button>
            <button class="dice-btn" data-dice="d4">D4</button>
            <button class="dice-btn" data-dice="d12">D12</button>
        </div>

        <div class="dice-display">
            <div class="dice" id="dice">🎲</div>
            <div class="result" id="result">-</div>
            <div class="combo-text" id="combo"></div>
        </div>

        <button class="roll-button" id="rollBtn">ROLL THE DICE</button>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Total Rolls</div>
                <div class="stat-value" id="totalRolls">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Highest Roll</div>
                <div class="stat-value" id="highestRoll">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Average Roll</div>
                <div class="stat-value" id="averageRoll">-</div>
            </div>
        </div>

        <div class="history">
            <div class="history-title">Roll History</div>
            <div class="history-list" id="history"></div>
            <button class="clear-btn" id="clearBtn">Clear History</button>
        </div>
    </div>

    <script>
        const state = {
            currentDice: 'd6',
            diceMaxes: {
                'd4': 4,
                'd6': 6,
                'd12': 12,
                'd20': 20,
                'd100': 100
            },
            rolls: [],
            isRolling: false
        };

        const elements = {
            dice: document.getElementById('dice'),
            result: document.getElementById('result'),
            rollBtn: document.getElementById('rollBtn'),
            clearBtn: document.getElementById('clearBtn'),
            history: document.getElementById('history'),
            totalRolls: document.getElementById('totalRolls'),
            highestRoll: document.getElementById('highestRoll'),
            averageRoll: document.getElementById('averageRoll'),
            combo: document.getElementById('combo')
        };

        // Initialize
        document.querySelectorAll('.dice-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.dice-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                state.currentDice = e.target.dataset.dice;
            });
        });

        elements.rollBtn.addEventListener('click', rollDice);
        elements.clearBtn.addEventListener('click', clearHistory);

        function rollDice() {
            if (state.isRolling) return;

            state.isRolling = true;
            elements.rollBtn.disabled = true;

            // Trigger haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate([50, 30, 50]);
            }

            // Play sound
            playSound();

            // Animate dice
            elements.dice.classList.add('rolling');

            setTimeout(() => {
                const max = state.diceMaxes[state.currentDice];
                const roll = Math.floor(Math.random() * max) + 1;
                
                state.rolls.push(roll);
                updateDisplay(roll);
                updateStats();
                updateHistory();
                checkCombos();

                elements.dice.classList.remove('rolling');
                state.isRolling = false;
                elements.rollBtn.disabled = false;
            }, 600);
        }

        function updateDisplay(roll) {
            elements.result.textContent = roll;
            elements.result.style.animation = 'none';
            setTimeout(() => {
                elements.result.style.animation = 'popUp 0.4s ease-out';
            }, 10);
        }

        function updateStats() {
            const total = state.rolls.length;
            const highest = Math.max(...state.rolls);
            const average = (state.rolls.reduce((a, b) => a + b, 0) / total).toFixed(1);

            elements.totalRolls.textContent = total;
            elements.highestRoll.textContent = highest;
            elements.averageRoll.textContent = average;
        }

        function updateHistory() {
            elements.history.innerHTML = state.rolls
                .slice()
                .reverse()
                .slice(0, 20)
                .map((roll, idx) => {
                    const rollNum = state.rolls.length - idx;
                    return `<div class="history-item">#${rollNum}: <span class="roll-num">${roll}</span></div>`;
                })
                .join('');
        }

        function checkCombos() {
            const last5 = state.rolls.slice(-5);
            
            if (last5.length >= 3) {
                const isAllSame = last5.every(r => r === last5[0]);
                if (isAllSame) {
                    elements.combo.textContent = 'TRIPLE COMBO! 🔥';
                    if (navigator.vibrate) {
                        navigator.vibrate([100, 50, 100, 50, 100]);
                    }
                    playComboSound();
                    return;
                }

                const isAscending = last5.every((r, i, arr) => i === 0 || r > arr[i - 1]);
                if (isAscending && last5.length >= 3) {
                    elements.combo.textContent = 'ASCENDING STREAK!';
                    if (navigator.vibrate) {
                        navigator.vibrate([50, 30, 50, 30, 50]);
                    }
                    return;
                }
            }

            if (last5.length >= 2 && last5[0] === last5[1]) {
                elements.combo.textContent = '👯 Double Roll!';
                return;
            }

            elements.combo.textContent = '';
        }

        function clearHistory() {
            if (confirm('Clear all roll history?')) {
                state.rolls = [];
                updateDisplay('-');
                updateStats();
                updateHistory();
                elements.combo.textContent = '';
            }
        }

        function playSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 400;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        function playComboSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [523, 659, 784, 1047]; // C, E, G, C (high)

            notes.forEach((freq, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, audioContext.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.1 + 0.15);

                osc.start(audioContext.currentTime + i * 0.1);
                osc.stop(audioContext.currentTime + i * 0.1 + 0.15);
            });
        }

        // Add CSS animation for result pop
        const style = document.createElement('style');
        style.textContent = `
            @keyframes popUp {
                0% { transform: scale(0.5); opacity: 0; }
                50% { transform: scale(1.2); }
                100% { transform: scale(1); opacity: 1; }
            }
        `;
        document.head.appendChild(style);
        function goBack() {
    window.location.href = "index.html";
}
    </script>
</body>
</html>
